<!-- iolite : e-mail « Confirmez votre adresse » (Supabase > Authentication > Emails > Confirm sign up)

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<style>:root{color-scheme:dark;supported-color-schemes:dark}body,.bg{background:#1A1630!important}</style>
</head>
<body bgcolor="#1A1630" style="margin:0;padding:0;background:#1A1630;">
  <table role="presentation" class="bg" width="100%" height="100%" bgcolor="#1A1630" cellpadding="0" cellspacing="0" border="0" style="background:#1A1630;width:100%;min-height:100%;">
    <tr><td align="center" bgcolor="#1A1630" style="padding:44px 24px 40px;background:#1A1630;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:460px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#F6F4FF;">
        <tr><td align="left">
          <img src="https://iolite-app.pages.dev/icon-192.png" width="56" height="56" alt="iolite" style="border-radius:16px;display:block;">
        </td></tr>
        <tr><td style="padding-top:26px;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-0.5px;color:#F6F4FF;">Bienvenue sur iolite</td></tr>
        <tr><td style="padding-top:12px;font-size:16px;line-height:1.55;color:#D9D6EE;">
          Plus qu'une étape&nbsp;: confirmez votre adresse e-mail pour commencer à suivre vos heures, votre salaire et votre planning.
        </td></tr>
        <tr><td style="padding-top:28px;">
          <a href="{{ .ConfirmationURL }}" style="display:block;background:#FFFFFF;color:#1A1630;text-decoration:none;font-weight:600;font-size:17px;text-align:center;padding:18px 24px;border-radius:999px;">Confirmer mon adresse</a>
        </td></tr>
        <tr><td style="padding-top:24px;font-size:13px;line-height:1.5;color:#A7A3C2;">
          Vous n'avez pas créé de compte iolite&nbsp;? Ignorez simplement cet e-mail.
        </td></tr>
        <tr><td style="padding-top:36px;font-size:12px;color:#8B87A8;">iolite · <a href="https://iolite-app.pages.dev/confidentialite" style="color:#A7A3C2;">Confidentialité</a></td></tr>
      </table>
    </td></tr>
  </table>

</html>
