<body class="bg-[#0a0a0a]">
  <div id="nav"></div>

  <!-- repères de section -->
  <div id="dots" class="fixed right-2.5 md:right-8 top-1/2 -translate-y-1/2 z-40 flex flex-col items-center gap-3"></div>

  <main id="snap" class="h-screen-d overflow-y-auto snap-y snap-mandatory scroll-smooth">
    <!-- Accueil -->
    <div class="snap-start h-screen-d" id="accueil">
      <section class="relative w-full h-full flex flex-col items-center justify-center overflow-hidden px-6">

        <h1 class="relative z-10 text-5xl min-[400px]:text-6xl md:text-7xl lg:text-8xl font-bold text-white tracking-tight text-center animate-fade-up" style="animation-delay:.2s">Tao ROLA</h1>
        <div class="relative z-10 h-12 flex items-center justify-center mt-4">
          <p class="text-xl md:text-2xl text-emerald-400 font-medium"><span id="typed"></span><span class="animate-pulse">|</span></p>
        </div>
        <a href="profil" class="relative z-10 mt-8 px-8 py-3 rounded-full border border-white/30 text-white/80 text-sm font-medium hover:bg-white/5 hover:border-white/50 transition-all duration-300 animate-fade-up" style="animation-delay:.6s">Mon profil (CV)</a>
        <div class="absolute bottom-8 md:bottom-12 z-10 pb-safe">
          <div class="flex items-center justify-center gap-4" id="socials"></div>
        </div>
      </section>
    </div>

    <!-- les trois catégories côte à côte (remplies par home.js) -->
    <div class="snap-start h-screen-d" id="categories">
      <section class="relative w-full h-full flex flex-col pt-20 md:pt-28 pb-4 md:pb-10 px-3 sm:px-6 md:px-8 pb-safe">
        <div id="cards" class="flex-1 min-h-0 grid grid-cols-1 grid-rows-3 lg:grid-cols-3 lg:grid-rows-1 gap-3 md:gap-5 max-w-[1600px] w-full mx-auto"></div>
      </section>
    </div>

    <!-- Contact -->
    <div class="snap-start min-h-screen-d flex" id="contact">
      <section class="relative w-full flex flex-col justify-center pt-24 md:pt-28 pb-12 px-5 sm:px-6 md:px-12">
        <div class="max-w-3xl w-full mx-auto">
          <div class="mb-8 sm:mb-10">
            <h2 class="text-4xl sm:text-5xl font-bold text-white">Contact</h2>
            <p class="text-white/50 text-lg mt-2 sm:mt-3">Un projet, une question ? Écrivez-moi, je vous réponds rapidement.</p>
          </div>
          <div class="flex flex-wrap gap-2 sm:gap-3 mb-10" id="quick"></div>
        <form id="form" class="space-y-5" novalidate>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div><label for="f-name" class="text-sm text-white/60 mb-2 block pl-5">Nom</label><input id="f-name" name="name" class="pill-field" required maxlength="200" autocomplete="name" placeholder="Votre nom"></div>
            <div><label for="f-email" class="text-sm text-white/60 mb-2 block pl-5">Email</label><input id="f-email" name="email" type="email" class="pill-field" required maxlength="320" autocomplete="email" inputmode="email" placeholder="votre@email.com"></div>
          </div>
          <div><label for="f-subject" class="text-sm text-white/60 mb-2 block pl-5">Sujet</label><input id="f-subject" name="subject" class="pill-field" required maxlength="300" placeholder="Objet de votre message"></div>
          <div><label for="f-message" class="text-sm text-white/60 mb-2 block pl-5">Message</label><textarea id="f-message" name="message" class="pill-field !rounded-3xl !h-auto min-h-[160px] py-4 resize-y" required maxlength="5000" placeholder="Votre message..."></textarea></div>
          <input type="text" name="website" tabindex="-1" autocomplete="off" class="hidden" aria-hidden="true">
          <div class="flex justify-center md:justify-start pt-1">
            <button class="inline-flex items-center justify-center gap-3 w-full sm:w-auto px-8 py-3.5 rounded-full bg-emerald-500 hover:bg-emerald-400 text-white text-sm font-medium transition-all duration-300 hover:scale-[1.02] disabled:opacity-50 disabled:pointer-events-none" type="submit" id="f-send"></button>
          </div>
        </form>
        </div>
      </section>
    </div>

    <div class="snap-start" id="pied"></div>
  </main>

  <script defer src="assets/common.js?v=9542ea42"></script>
  <script defer src="assets/contact.js?v=63821625"></script>
  <script defer src="assets/home.js?v=26c2ebe6"></script>
</body>
</html>
