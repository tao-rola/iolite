<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Albane Riou — Portfolio · iolite.team</title>
<meta name="description" content="Portfolio d'Albane Riou, étudiante en BUT Métiers du Multimédia et de l'Internet à l'IUT de Rouen : illustration, audiovisuel, 3D et communication.">
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/portfolio/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,800;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Variables
   ========================================================= */
:root{
  --black:#0a0a0a;
  --ink:#111;
  --paper:#f3f1ec;
  --paper-2:#e7e4dd;
  --grey:#8a8780;
  --red:#d3231b;
  --display:'Anton', 'Impact', 'Arial Narrow', sans-serif;
  --sans:'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
  --serif:'Instrument Serif', Georgia, serif;
  --pw: min(40vw, calc((100svh - 150px) * .72));
  --ph: calc(var(--pw) / .72);
  --flip: 1s;
}
@media (max-width: 760px){ :root{ --pw: min(92vw, calc((100svh - 140px) * .72)); } }
@media (prefers-reduced-motion: reduce){ :root{ --flip:.01s; } }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--black);color:#fff;font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{ /* halo très léger sous le magazine */
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 55% at 50% 52%, rgba(255,255,255,.07), transparent 70%);
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* =========================================================
   En-tête & navigation
   ========================================================= */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:16px 26px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;
}
.topbar a{text-decoration:none;opacity:.7;transition:opacity .2s}
.topbar a:hover{opacity:1}
.topbar .mast{font-family:var(--display);font-size:22px;letter-spacing:.02em;opacity:1}
.topbar nav{display:flex;gap:22px;justify-content:flex-end}
.topbar nav button{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;transition:opacity .2s,color .2s}
.topbar nav button:hover,.topbar nav button.on{opacity:1}
.topbar nav button.on{color:var(--red)}
@media (max-width: 900px){ .topbar nav{display:none} .topbar{grid-template-columns:1fr auto 1fr} }

.controls{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
}
.controls button{
  width:40px;height:40px;border:1px solid rgba(255,255,255,.35);border-radius:50%;
  display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,opacity .2s;
}
.controls button:hover{background:#fff;color:#000;border-color:#fff}
.controls button:disabled{opacity:.2;pointer-events:none}
.controls .ind{min-width:170px;text-align:center;opacity:.8}
.progress{position:fixed;left:0;bottom:0;height:2px;background:var(--red);z-index:41;transition:width var(--flip) cubic-bezier(.645,.045,.355,1)}
.hint{
  position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:40;font-family:var(--serif);font-style:italic;
  font-size:17px;opacity:.75;transition:opacity .6s;pointer-events:none;white-space:nowrap;
}
.hint.hide{opacity:0}

/* =========================================================
   Magazine (mécanique de pages)
   ========================================================= */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-top:14px}
.book-wrap{position:relative;width:calc(var(--pw) * 2);height:var(--ph)}
.book{position:absolute;inset:0;perspective:3000px;perspective-origin:50% 45%;transition:transform var(--flip) cubic-bezier(.645,.045,.355,1)}
.book.at-start{transform:translateX(-25%)}
.book.at-end{transform:translateX(25%)}
.mobile .book-wrap{width:var(--pw);overflow:hidden}
.mobile .book{left:calc(var(--pw) * -1);right:auto;width:calc(var(--pw) * 2)}
.mobile .book.at-start,.mobile .book.at-end{transform:none}

.leaf{
  position:absolute;top:0;left:50%;width:50%;height:100%;
  transform-origin:left center;transform-style:preserve-3d;
  transition:transform var(--flip) cubic-bezier(.645,.045,.355,1);
}
.leaf.flipped{transform:rotateY(-180deg)}
.side{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper)}
.side.back{transform:rotateY(180deg)}
.side.front{box-shadow:10px 14px 40px rgba(0,0,0,.55)}
.side.back{box-shadow:-10px 14px 40px rgba(0,0,0,.55)}
/* pli central */
.side::before{content:"";position:absolute;top:0;bottom:0;width:9%;pointer-events:none;z-index:20}
.side.front::before{left:0;background:linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,.06) 35%, rgba(0,0,0,0))}
.side.back::before{right:0;background:linear-gradient(-90deg, rgba(0,0,0,.28), rgba(0,0,0,.06) 35%, rgba(0,0,0,0))}
.mobile .side.front::before{width:4%}
/* reflet pendant la rotation */
.side::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:21;opacity:0;
  background:linear-gradient(90deg, rgba(0,0,0,.35), rgba(255,255,255,.18) 45%, rgba(0,0,0,0) 75%)}
.leaf.turning .side::after{animation:sheen var(--flip) ease-in-out}
@keyframes sheen{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
/* tranche */
.edge{position:absolute;top:.6%;bottom:.6%;width:6px;z-index:0;pointer-events:none;transition:opacity .4s;
  background:repeating-linear-gradient(90deg,#eceae4 0 1px,#bdb9b0 1px 2px)}
.edge.r{right:-4px}.edge.l{left:-4px}
.mobile .edge{display:none}

/* coins */
.corner{position:absolute;bottom:0;width:14%;aspect-ratio:1;z-index:30;cursor:pointer}
.corner.next{right:0}.corner.prev{left:0}
.corner::after{content:"";position:absolute;bottom:0;width:0;height:0;transition:width .25s,height .25s}
.corner.next::after{right:0;background:linear-gradient(135deg,#d9d6cf 50%,transparent 50%);box-shadow:-3px -3px 8px rgba(0,0,0,.25)}
.corner.prev::after{left:0;background:linear-gradient(225deg,#d9d6cf 50%,transparent 50%);box-shadow:3px -3px 8px rgba(0,0,0,.25)}
.corner:hover::after{width:50%;height:50%}

/* =========================================================
   Pages : base
   ========================================================= */
.face{
  position:absolute;inset:0;color:var(--ink);
  font-size:calc(var(--pw) / 36);line-height:1.5;
  padding:4.2em 3.2em 3.6em;
}
.mobile .face{font-size:calc(var(--pw) / 32);padding:3.8em 2.6em 3.4em}
.face.dark{background:var(--black);color:#f2f0eb}
.face.red{background:var(--red);color:#fff}
.face.bleed{padding:0}

/* folio : en-tête et numéro de page */
.folio{position:absolute;left:3.2em;right:3.2em;top:1.6em;display:flex;justify-content:space-between;
  font-size:.62em;letter-spacing:.16em;text-transform:uppercase;font-weight:600;z-index:15;opacity:.75}
.pnum{position:absolute;bottom:1.5em;font-size:.68em;font-weight:600;letter-spacing:.1em;z-index:15;opacity:.75}
.side.front .pnum{right:3.2em}.side.back .pnum{left:3.2em}
.mobile .side .pnum{right:2.6em;left:auto}
.mobile .folio{left:2.6em;right:2.6em}
.bleed .folio,.bleed .pnum{color:#fff;opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.4)}

/* typo */
.disp{font-family:var(--display);font-weight:400;line-height:.88;text-transform:uppercase;letter-spacing:-.005em}
.k{font-size:.66em;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
.k.red,.red-t{color:var(--red)}
.serif{font-family:var(--serif);font-weight:400}
.it{font-style:italic}
p{margin:0 0 .75em;hyphens:auto;text-align:justify}
.small{font-size:.86em;line-height:1.5}
.lead{font-family:var(--serif);font-size:1.55em;line-height:1.15;text-align:left;margin-bottom:.8em}
.cols{column-count:2;column-gap:1.6em}
.cols p{text-align:justify}
.rule{height:1px;background:currentColor;opacity:.25;margin:1em 0}
.abs{position:absolute}
.img{position:absolute;overflow:hidden;background:#222}
.img img{display:block;width:100%;height:100%;object-fit:cover}
.img.full{inset:0}
.shade-b::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.75))}
.shade-t::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.55))}
.vert{writing-mode:vertical-rl;transform:rotate(180deg)}
.tagline{display:flex;flex-wrap:wrap;gap:.4em .9em;font-size:.66em;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.tagline span::before{content:"— ";color:var(--red)}
.box{background:var(--red);color:#fff;padding:.25em .6em;display:inline-block}
.video{position:absolute;background:#000;z-index:5}
.video video{display:block;width:100%;height:100%;object-fit:cover;background:#000}
.video .cap{position:absolute;left:0;bottom:-2em;font-size:.62em;letter-spacing:.16em;text-transform:uppercase;font-weight:600}

/* =========================================================
   Pages : spécifiques
   ========================================================= */
/* couverture */
.cover .img img{filter:grayscale(1) contrast(1.1)}
.cover .mast{position:absolute;left:.12em;right:.12em;top:.32em;color:#fff;font-size:8.3em;text-align:center;z-index:4;mix-blend-mode:difference}
.mobile .cover .mast{font-size:7.2em}
.cover .top{position:absolute;left:2.2em;right:2.2em;top:1.3em;display:flex;justify-content:space-between;color:#fff;z-index:5}
.cover .lines{position:absolute;left:2.2em;bottom:6.5em;z-index:5;color:#fff;width:46%}
.cover .lines div{margin-bottom:1em}
.cover .lines b{display:block;font-family:var(--display);font-weight:400;font-size:1.7em;line-height:.95;text-transform:uppercase}
.cover .lines small{font-size:.75em;opacity:.85}
.cover .name{position:absolute;right:2.2em;bottom:2.2em;text-align:right;color:#fff;z-index:5}
.cover .name .disp{font-size:3.6em}
.cover .barcode{position:absolute;left:2.2em;bottom:2.2em;z-index:5;background:#fff;padding:.4em .5em .25em;color:#000;font-size:.5em;letter-spacing:.2em;text-align:center}
.cover .barcode i{display:block;width:9em;height:2.6em;margin-bottom:.3em;
  background:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 3px,#000 3px 4px,transparent 4px 7px,#000 7px 10px,transparent 10px 11px)}
.cover .badge{position:absolute;right:2.2em;top:40%;z-index:5;width:6.5em;height:6.5em;border-radius:50%;background:var(--red);color:#fff;
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:.8em;font-weight:800;line-height:1.05;letter-spacing:.04em;text-transform:uppercase;transform:rotate(-10deg)}

/* sommaire */
.toc{list-style:none;margin-top:1em;border-top:1px solid rgba(0,0,0,.85)}
.toc li{border-bottom:1px solid rgba(0,0,0,.18)}
.toc button{display:grid;grid-template-columns:2.6em 1fr auto;align-items:baseline;width:100%;text-align:left;padding:.42em 0;transition:padding .25s,color .2s}
.toc button:hover{padding-left:.5em;color:var(--red)}
.toc .n{font-family:var(--display);font-size:1.25em;color:var(--red)}
.toc .t{font-weight:600;font-size:1.02em}
.toc .t small{display:inline;margin-left:.6em;font-weight:400;font-size:.8em;opacity:.55}
.toc .p{font-size:.75em;font-weight:600;letter-spacing:.1em}

/* parcours */
.tl .row{display:grid;grid-template-columns:6.4em 1fr;gap:1em;padding:.7em 0;border-bottom:1px solid rgba(0,0,0,.15)}
.tl .d{font-size:.7em;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--red);padding-top:.25em}
.tl .t{font-weight:600;line-height:1.25}
.tl .s{font-size:.86em;opacity:.65}
.tl-h{font-family:var(--display);font-size:1.6em;text-transform:uppercase;margin:1.1em 0 .2em;line-height:1}

/* compétences */
.skills{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #fff}
.skills div{padding:.6em 0;border-bottom:1px solid rgba(255,255,255,.18);font-weight:500;display:flex;justify-content:space-between}
.skills div span{opacity:.5;font-size:.8em}
.skills div:nth-child(odd){padding-right:1em}

/* boutons */
.btn{display:inline-flex;align-items:center;gap:.6em;font-size:.72em;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  padding:1em 1.4em;border:1px solid currentColor;text-decoration:none;transition:background .2s,color .2s}
.dark .btn:hover{background:#fff;color:#000}
.face:not(.dark) .btn:hover{background:#000;color:#fff}
.btn.fill{background:var(--red);border-color:var(--red);color:#fff}
.btn.fill:hover{background:#fff!important;color:#000!important;border-color:#fff}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header class="topbar">
  <a href="/portfolio/">← iolite.team</a>
  <span class="mast">ALBANE RIOU</span>
  <nav aria-label="Rubriques">
    <button data-goto="2">Sommaire</button>
    <button data-goto="3">Édito</button>
    <button data-goto="7">Projets</button>
    <button data-goto="19">Contact</button>
  </nav>
</header>

<main class="stage" aria-label="Portfolio d'Albane Riou au format magazine">
  <div class="book-wrap"><div class="book" id="book"></div></div>
</main>

<div class="hint" id="hint">Cliquez sur le coin de la page, ou utilisez les flèches ← →</div>
<div class="controls">
  <button id="prev" aria-label="Page précédente"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="ind" id="ind" aria-live="polite">Couverture</span>
  <button id="next" aria-label="Page suivante"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<div class="progress" id="progress"></div>

<!-- =========================================================
     PAGES DU MAGAZINE
     Une <section class="face"> = une page.
     0 = couverture ; ensuite les doubles pages (impaire à gauche, paire à droite) ; dernière = 4e de couverture.
     Garder un nombre PAIR de pages.
     Classes de fond : (aucune) papier · dark · red · bleed (image pleine page, sans marges).
     data-nofolio : pas d'en-tête ni de numéro de page.
     Images : data-asset="chemin" (résolu avec ASSET_BASE, voir le script en bas).
     ========================================================= -->
<template id="pages">

  <!-- 0 · COUVERTURE -->
  <section class="face bleed cover" data-label="Couverture" data-nofolio>
    <div class="img full shade-b"><img data-asset="photo/moi.png" alt="Portrait d'Albane Riou"></div>
    <div class="top k"><span>N°01 — Édition 2026</span><span>BUT MMI · Rouen</span></div>
    <div class="mast disp">Portfolio</div>
    <div class="badge">Prix<br>Green<br>Awards<br>2025</div>
    <div class="lines">
      <div><b>Portraits</b><small>Une série dessinée sur tablette graphique</small></div>
      <div><b>Seconde Chance</b><small>Un court métrage contre la fast fashion</small></div>
      <div><b>Casque de F1</b><small>De la modélisation au rendu 3D</small></div>
    </div>
    <div class="name"><div class="k" style="margin-bottom:.4em">Design · Audiovisuel · 3D</div><div class="disp">Albane<br>Riou</div></div>
  </section>

  <!-- 1 · 2E DE COUVERTURE (gauche) -->
  <section class="face dark" data-label="Ours">
    <div class="disp" style="font-size:11em;line-height:.8;margin-top:.15em">N°<br>01</div>
    <div class="abs" style="left:3.2em;right:3.2em;bottom:4.2em">
      <div class="rule" style="opacity:.5"></div>
      <div class="small" style="display:grid;grid-template-columns:1fr 1fr;gap:1.2em">
        <div><div class="k red">Direction artistique</div>Albane Riou</div>
        <div><div class="k red">Formation</div>BUT MMI, IUT de Rouen</div>
        <div><div class="k red">Disciplines</div>Illustration, vidéo, 3D, web, communication</div>
        <div><div class="k red">Publié sur</div>iolite.team</div>
      </div>
    </div>
  </section>

  <!-- 2 · SOMMAIRE (droite) -->
  <section class="face" data-label="Sommaire">
    <div class="disp" style="font-size:5.8em">Som&#8209;<br>maire</div>
    <ul class="toc">
      <li><button data-goto="3"><span class="n">—</span><span class="t">Édito<small>Qui suis-je ?</small></span><span class="p">03</span></button></li>
      <li><button data-goto="5"><span class="n">—</span><span class="t">Parcours &amp; outils<small>Formation, expériences, compétences</small></span><span class="p">05</span></button></li>
      <li><button data-goto="7"><span class="n">01</span><span class="t">Portraits<small>Illustration numérique</small></span><span class="p">07</span></button></li>
      <li><button data-goto="9"><span class="n">02</span><span class="t">Seconde Chance<small>Court métrage</small></span><span class="p">09</span></button></li>
      <li><button data-goto="11"><span class="n">03</span><span class="t">Casque de F1<small>Modélisation 3D</small></span><span class="p">11</span></button></li>
      <li><button data-goto="13"><span class="n">04</span><span class="t">Village<small>Vidéo</small></span><span class="p">13</span></button></li>
      <li><button data-goto="15"><span class="n">05</span><span class="t">BDE La Bête<small>Communication</small></span><span class="p">15</span></button></li>
      <li><button data-goto="17"><span class="n">06</span><span class="t">Dernière Enquête<small>Vidéo</small></span><span class="p">17</span></button></li>
      <li><button data-goto="19"><span class="n">—</span><span class="t">Contact</span><span class="p">19</span></button></li>
    </ul>
  </section>

  <!-- 3 · ÉDITO (gauche) -->
  <section class="face" data-label="Édito">
    <div class="k red">Édito</div>
    <div class="disp" style="font-size:7.2em;margin:.12em 0 .25em">Bonjour.</div>
    <p class="lead">Moi c'est Albane, étudiante en BUT Métiers du Multimédia et de l'Internet à l'IUT de Rouen.</p>
    <div class="cols small">
      <p>Depuis toute petite, le dessin occupe une place essentielle dans ma vie : un terrain de jeu, un espace d'expression, parfois même un refuge.</p>
      <p>Aujourd'hui, j'aime raconter des histoires avec toutes sortes d'outils : le crayon et la tablette graphique, la caméra, la 3D ou le code.</p>
      <p>Ce magazine rassemble des projets personnels et des projets réalisés pendant ma formation : illustration, court métrage, modélisation 3D et communication associative.</p>
      <p>En dehors des écrans, je sculpte, je danse et je fais de la boxe anglaise.</p>
    </div>
    <div class="serif it abs" style="right:3.2em;bottom:3.4em;font-size:2.4em">— Albane</div>
  </section>

  <!-- 4 · ÉDITO, PHOTO (droite) -->
  <section class="face bleed" data-label="Édito">
    <div class="img full shade-b"><img data-asset="photo/moi.png" alt="Albane Riou"></div>
    <div class="abs" style="left:2.4em;right:2.4em;bottom:3.6em;color:#fff;z-index:4">
      <div class="k" style="margin-bottom:.8em"><span class="box">Manifeste</span></div>
      <div class="disp" style="font-size:5.6em">Dessiner.<br>Filmer.<br>Modéliser.</div>
    </div>
  </section>

  <!-- 5 · PARCOURS (gauche) -->
  <section class="face" data-label="Parcours">
    <div class="disp vert abs" style="left:1.2em;top:4.2em;bottom:3.6em;font-size:5.2em;text-align:right">Parcours</div>
    <div style="margin-left:8.4em">
      <div class="tl-h" style="margin-top:0">Formation</div>
      <div class="tl">
        <div class="row"><div class="d">Depuis 2024</div><div><div class="t">BUT Métiers du Multimédia et de l'Internet</div><div class="s">IUT de Rouen</div></div></div>
        <div class="row"><div class="d">2020–2024</div><div><div class="t">Baccalauréat général, mention assez bien</div><div class="s">Institution de Lisieux</div></div></div>
      </div>
      <div class="tl-h">Expériences</div>
      <div class="tl">
        <div class="row"><div class="d">Saison d'été</div><div><div class="t">Réceptionniste</div><div class="s">Hôtel Amirauté, Deauville</div></div></div>
        <div class="row"><div class="d">2024</div><div><div class="t">Contrat étudiant, mise en rayon</div><div class="s">E.Leclerc, Lisieux</div></div></div>
        <div class="row"><div class="d">Saisonnier</div><div><div class="t">Mise en rayon</div><div class="s">Intermarché, Lisieux</div></div></div>
      </div>
      <div class="tl-h">Engagements</div>
      <div class="tl">
        <div class="row"><div class="d">Depuis 2025</div><div><div class="t">BDE La Bête, pôle communication</div></div></div>
        <div class="row"><div class="d">2021–2023</div><div><div class="t">Conseillère municipale des jeunes</div><div class="s">Ville de Lisieux</div></div></div>
      </div>
    </div>
  </section>

<script>
/* ---------------------------------------------------------
   Où se trouvent les images et vidéos.
   Une fois les fichiers copiés dans /portfolio/albane-riou/assets/,
   remplacer par :  const ASSET_BASE = 'assets/';
   --------------------------------------------------------- */
const ASSET_BASE = 'https://albaneriou.fr/';

(() => {
  const book = document.getElementById('book');
  const tpl = document.getElementById('pages');
  const ind = document.getElementById('ind');
  const prevB = document.getElementById('prev');
  const nextB = document.getElementById('next');
  const hint = document.getElementById('hint');
  const bar = document.getElementById('progress');
  const faces = [...tpl.content.children];
  const mq = matchMedia('(max-width: 760px)');
  const FLIP_MS = matchMedia('(prefers-reduced-motion: reduce)').matches ? 10 : 1000;

  let leaves = [], flipped = 0, mobile = false, queue = null, turnZ = 100;

  function resolveAssets(root){
    root.querySelectorAll('[data-asset]').forEach(el => {
      el.src = ASSET_BASE + el.dataset.asset;
      if (el.tagName === 'IMG') { el.loading = 'lazy'; el.decoding = 'async'; }
    });
    root.querySelectorAll('[data-asset-poster]').forEach(el => el.poster = ASSET_BASE + el.dataset.assetPoster);
  }

  function makeSide(cls, fi){
    const side = document.createElement('div');
    side.className = 'side ' + cls;
    if (fi == null) side.innerHTML = '<section class="face"></section>';
    else {
      const f = faces[fi].cloneNode(true);
      side.appendChild(f);
      if (!f.hasAttribute('data-nofolio')) {
        const fo = document.createElement('div');
        fo.className = 'folio';
        fo.innerHTML = '<span>Albane Riou — Portfolio</span><span>' + (f.dataset.label || '') + '</span>';
        f.appendChild(fo);
        const n = document.createElement('span');
        n.className = 'pnum'; n.textContent = String(fi).padStart(2, '0');
        f.appendChild(n);
      }
    }
    if (cls === 'front') addCorner(side, 'next');
    if (cls === 'back' || (mobile && cls === 'front' && fi !== 0)) addCorner(side, 'prev');
    return side;
  }
  function addCorner(side, dir){
    const c = document.createElement('button');
    c.className = 'corner ' + dir;
    c.setAttribute('aria-label', dir === 'next' ? 'Page suivante' : 'Page précédente');
    c.addEventListener('click', e => { e.stopPropagation(); dir === 'next' ? next() : prev(); });
    side.appendChild(c);
  }

  function build(keep){
    mobile = mq.matches;
    document.body.classList.toggle('mobile', mobile);
    book.innerHTML = ''; leaves = [];
    const n = mobile ? faces.length : Math.ceil(faces.length / 2);
    for (let i = 0; i < n; i++) {
      const leaf = document.createElement('div');
      leaf.className = 'leaf';
      const fF = mobile ? i : 2 * i;
      const fB = mobile ? null : (2 * i + 1 < faces.length ? 2 * i + 1 : null);
      leaf.appendChild(makeSide('front', fF));
      leaf.appendChild(makeSide('back', fB));
      leaf.addEventListener('transitionend', e => {
        if (e.target === leaf && e.propertyName === 'transform') { leaf.classList.remove('turning'); setZ(); }
      });
      book.appendChild(leaf); leaves.push(leaf);
    }
    ['l','r'].forEach(s => { const e = document.createElement('div'); e.className = 'edge ' + s; book.appendChild(e); });
    resolveAssets(book);
    book.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); goTo(+b.dataset.goto); }));
    book.style.transition = 'none';
    flipped = targetFor(keep || 0);
    leaves.forEach((l, i) => { l.style.transition = 'none'; l.classList.toggle('flipped', i < flipped); });
    setZ(); update();
    requestAnimationFrame(() => requestAnimationFrame(() => { book.style.transition = ''; leaves.forEach(l => l.style.transition = ''); }));
  }

  function setZ(){
    leaves.forEach((l, i) => {
      if (l.classList.contains('turning')) return;
      l.style.zIndex = l.classList.contains('flipped') ? i + 1 : leaves.length - i;
    });
  }
  const targetFor = f => mobile ? f : Math.ceil(f / 2);
  const currentFace = () => mobile ? flipped : (flipped === 0 ? 0 : 2 * flipped - 1);

  function flipOne(dir){
    const leaf = leaves[dir > 0 ? flipped : flipped - 1];
    if (!leaf) return;
    book.querySelectorAll('video').forEach(v => { if (!v.paused) v.pause(); });
    leaf.classList.add('turning');
    leaf.style.zIndex = ++turnZ;
    leaf.classList.toggle('flipped', dir > 0);
    flipped += dir;
    update();
    hint.classList.add('hide');
  }
  const cancelQueue = () => { if (queue) { clearInterval(queue); queue = null; } };
  function next(){ cancelQueue(); flipOne(1); }
  function prev(){ cancelQueue(); flipOne(-1); }
  function goTo(f){
    cancelQueue();
    const target = Math.max(0, Math.min(leaves.length, targetFor(f)));
    if (target === flipped) return;
    const step = target > flipped ? 1 : -1;
    flipOne(step);
    if (flipped === target) return;
    queue = setInterval(() => { flipOne(step); if (flipped === target) cancelQueue(); }, Math.min(170, FLIP_MS));
  }

  function update(){
    book.classList.toggle('at-start', flipped === 0);
    book.classList.toggle('at-end', flipped === leaves.length);
    prevB.disabled = flipped === 0;
    nextB.disabled = flipped === leaves.length;
    const el = book.querySelector('.edge.l'), er = book.querySelector('.edge.r');
    if (el) el.style.opacity = flipped > 0 ? 1 : 0;
    if (er) er.style.opacity = flipped < leaves.length ? 1 : 0;
    bar.style.width = (flipped / leaves.length * 100) + '%';

    const cf = currentFace();
    let label;
    if (flipped === 0) label = 'Couverture';
    else if (flipped === leaves.length && !mobile) label = '4e de couverture';
    else if (mobile) label = (faces[cf].dataset.label || '') + ' · ' + String(cf).padStart(2, '0');
    else { const r = Math.min(2 * flipped, faces.length - 1); label = (faces[r].dataset.label || '') + ' · ' + String(cf).padStart(2,'0') + '–' + String(r).padStart(2,'0'); }
    ind.textContent = label;
    history.replaceState(null, '', cf ? '#p' + cf : location.pathname + location.search);
    const navs = [...document.querySelectorAll('.topbar nav button')];
    navs.forEach((b, i) => {
      const g = +b.dataset.goto, nx = navs[i + 1] ? +navs[i + 1].dataset.goto : 99;
      b.classList.toggle('on', cf >= g - 1 && cf < nx - 1);
    });
  }

  prevB.addEventListener('click', prev);
  nextB.addEventListener('click', next);
  document.querySelectorAll('.topbar [data-goto]').forEach(b => b.addEventListener('click', () => goTo(+b.dataset.goto)));
  document.addEventListener('keydown', e => {
    if (e.target.closest('video, input, textarea')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    if (e.key === 'Home') goTo(0);
    if (e.key === 'End') goTo(faces.length - 1);
  });
  let tx = null, ty = null;
  book.addEventListener('touchstart', e => {
    if (e.target.closest('video')) { tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  book.addEventListener('touchend', e => {
    if (tx == null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) dx < 0 ? next() : prev();
    tx = null;
  });
  mq.addEventListener('change', () => build(currentFace()));

  const start = parseInt((location.hash.match(/^#p(\d+)$/) || [])[1] || '0', 10);
  build(Math.min(start, faces.length - 1));
  setTimeout(() => hint.classList.add('hide'), 6000);
})();
</script>
