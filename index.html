var W=null; /* assistant en cours : {k, i, svcs} */
function dayRef(){var k=key(S.cur),d=S.days[k]||(S.days[k]={mode:modeOf(S.days[k])});if(!d.mode)d.mode=modeOf(d);return {k:k,d:d};}
function tidy(k){var d=S.days[k];if(d&&isBlank(d))delete S.days[k];saveDays();}
function svcObj(s){var x=dayRef();return x.d[s]||(x.d[s]={start:"",end:"",pause:0,repas:null});}
function svcLabel(s){return s==="cont"?"Journée continue":NAMES[s];}

/* dernières valeurs utilisées pour un service (raccourcis) */
function recent(s,f,n){var out=[],ks=Object.keys(S.days).sort().reverse();
  for(var i=0;i<ks.length&&out.length<n;i++){var v=S.days[ks[i]][s];if(v&&v[f]!=null&&v[f]!==""&&out.indexOf(v[f])<0)out.push(v[f]);}return out;}

/* étapes de l'assistant selon les réponses déjà données */
function wizSteps(){var d=shiftData(),m=modeOf(d),st=["type"];
  if(!W.typed)return st;
  if(m==="conge"||m==="off")return st;
  var list=m==="continue"?["cont"]:(W.svcs||["midi","soir"]);
  list.forEach(function(s){st.push("start:"+s,"end:"+s,"pause:"+s,"repas:"+s);});
  return st;}
function wizStart(){var d=shiftData(),had={};SVCS.forEach(function(s){if(d[s]&&(d[s].start||d[s].end||d[s].pause))had[s]=1;});
  W={k:key(S.cur),i:0,typed:!!S.days[key(S.cur)],had:had,pt:{},
  svcs:modeOf(d)==="coupure"&&(d.midi||d.soir)?["midi","soir"].filter(function(s){return d[s];}):["midi","soir"]};renderShift();}
function wizNext(){var st=wizSteps();W.i++;if(W.i>=st.length){W=null;}renderShift();window.scrollTo(0,0);}
function wizBack(){if(W.i===0){W=null;}else W.i--;renderShift();}

function renderShift(){
  dateHead();
  if(W&&W.k!==key(S.cur))W=null;
  if(W){renderWizard();return;}
  var d=shiftData(),r=dayCalc(d),k=key(S.cur),pl=planOf(k),pt=planTotal(k),has=entered(d);
  var m=modeOf(d),word=S.days[k]&&m==="repos"?"Repos":S.days[k]&&m==="conge"?"Congé payé":null;
  var h=weekStrip()+'<section class="hero"><div><div class="lbl">'+(word?"Journée":"Total de la journée")+'</div><div class="big'+(word?" word":"")+'"'+(word?'':' data-count="'+Math.round(r.total)+'"')+'>'+(word||fmt(r.total))+'</div></div></section>';
  /* deux cartes identiques : prévu sur Combo, puis pointé */
  function rowHtml2(label,sub,val){return '<div class="sum-row"><span class="sum-t">'+label+(sub?'<small>'+sub+'</small>':'')+'</span><span class="sum-v">'+val+'</span></div>';}
  function slotSub(v){return esc(v.start||"?")+' / '+esc(v.end||"?")+' · pause '+(v.pause||0)+' min'+(v.repas===true?' · repas':'');}
  var plRows="",ps=planToSvcs(k);
  if(pl.length&&pl[0].allday)plRows=isAbsence(pl[0])?rowHtml2(esc(pl[0].title),"Journée entière","1j"):rowHtml2("Repos","Aucun créneau planifié","0h00");
  else if(ps)["midi","soir","cont"].forEach(function(sv){var v=ps[sv];if(!v)return;var c=svcCalc(v);plRows+=rowHtml2(svcLabel(sv),slotSub(v),c?fmt(c.net):"");});
  else if(planRest(k))plRows=rowHtml2("Repos","Aucun créneau planifié","0h00");
  if(plRows)h+='<section class="svc sum-card"><div class="card-h"><span><i class="card-dot combo"></i>Prévu sur Combo</span></div>'+plRows+'</section>';
  if(has&&!active(d).length)h+='<section class="svc sum-card"><div class="card-h"><span><i class="card-dot"></i>Pointé</span></div>'+(m==="repos"?rowHtml2("Repos","Journée non travaillée","0h00"):
      S.cur.getDay()===0?rowHtml2("Congé payé","Dimanche non décompté","0j"):rowHtml2("Congé payé","1 jour décompté · "+joursMot(congesInfo(new Date()).reste)+" restant"+(Math.abs(congesInfo(new Date()).reste)>1?"s":""),"1j"))+'</section>';
  if(has&&active(d).length){var rows="";
    active(d).forEach(function(sv){var v=d[sv],c=svcCalc(v);if(!v||!(v.start||v.end))return;rows+=rowHtml2(svcLabel(sv),slotSub(v),c?fmt(c.net):"");});
    h+='<section class="svc sum-card"><div class="card-h"><span><i class="card-dot"></i>Pointé</span>'+'</div>'+rows+'</section>';}
  if(has){
    h+='<button class="btn-main" data-wiz="start">Modifier</button>';
  }else{
    h+='<button class="btn-main" data-wiz="start">Pointer cette journée</button>';
  }
  view.innerHTML=h;countUp();updateBadge();checkReminder();
}

/* une question par écran */
function renderWizard(){
  var st=wizSteps(),step=st[Math.min(W.i,st.length-1)],d=shiftData(),k=key(S.cur),pl=planOf(k),parts=step.split(":"),s=parts[1];
  var total=W.typed?st.length:6,pct=Math.round((W.i+1)/total*100);
  var from=W.lastPct==null?0:W.lastPct;W.lastPct=Math.min(100,pct);
  var h='<div class="wiz"><div class="wiz-bar"><div style="--from:'+from+'%;width:'+W.lastPct+'%"></div></div>';
  var eyebrow="",q="",body="",next=false;
  if(step==="type"){
    q="Quel type de journée ?";
    eyebrow=pl.length?(pl[0].allday?"Prévu sur Combo : "+planText(pl):"Prévu sur Combo : "+planText(pl)):planRest(k)?"Prévu sur Combo : repos":"";
    var cur=!S.days[k]?null:modeOf(d)==="repos"?"off":modeOf(d);
    body='<div class="choices">'+
      [["continue","Continue",""],["coupure","Coupure",""],["off","Repos",""],["conge","Congé payé",""]].map(function(o){
        return '<button class="choice'+(cur===o[0]?" on":"")+'" data-wiztype="'+o[0]+'">'+o[1]+(o[2]?'<small>'+o[2]+'</small>':'')+'</button>';}).join("")+'</div>';
  }else if(parts[0]==="start"||parts[0]==="end"){
    var f=parts[0],v=(d[s]&&d[s][f])||"",sug=[],pp=planFor(k,s);
    if(pp&&pp[f])sug.push(pp[f]);recent(s,f,4).forEach(function(x){if(sug.indexOf(x)<0&&sug.length<4)sug.push(x);});
    if(!v&&sug.length)v=sug[0];
    eyebrow=svcLabel(s);q=f==="start"?"À quelle heure avez-vous commencé ?":"À quelle heure avez-vous fini ?";
    body='<input type="time" class="wiz-time" id="wiz-time" data-wizf="'+f+'" data-wizs="'+s+'" value="'+esc(v)+'">'+
      (sug.length?'<div class="quick">'+sug.map(function(x){return '<button data-wizset="'+x+'">'+x+(pp&&pp[f]===x?' · prévu':'')+'</button>';}).join("")+'</div>':'');
    next=true;
  }else if(parts[0]==="pause"){
    var o=svcObj(s);if(!W.had[s]&&!W.pt[s]){var pp2=planFor(k,s),rp=recent(s,"pause",1);o.pause=pp2&&pp2.pause!=null?pp2.pause:(rp.length?rp[0]:0);W.pt[s]=1;tidy(k);}
    eyebrow=svcLabel(s);q="Combien de temps de pause ?";
    body='<div class="stepper big"><button data-wizpause="-5" aria-label="Retirer 5 minutes">−</button><output id="wiz-pause">'+(o.pause||0)+' min</output><button data-wizpause="5" aria-label="Ajouter 5 minutes">+</button></div>';
    next=true;
  }else if(parts[0]==="repas"){
    eyebrow=svcLabel(s);q="Le repas a-t-il été fourni ?";var rv=d[s]&&d[s].repas;
    body='<div class="choices two"><button class="choice'+(rv===true?" on":"")+'" data-wizrepas="1">Oui</button><button class="choice'+(rv===false?" on":"")+'" data-wizrepas="0">Non</button></div>';
  }
  h+=(eyebrow?'<div class="wiz-eyebrow">'+eyebrow+'</div>':'')+'<h2 class="wiz-q">'+q+'</h2>'+body+
    '<div class="wiz-nav"><button class="wiz-back" data-wiz="back">Retour</button>'+(next?'<button class="btn-main" data-wiz="next">'+(W.i===st.length-1?"Terminer":"Suivant")+'</button>':'')+'</div></div>';
  view.innerHTML=h;
  var ti=document.getElementById("wiz-time");if(ti&&ti.value&&!(d[s]&&d[s][parts[0]])){svcObj(s)[parts[0]]=ti.value;tidy(key(S.cur));}
}
function wizClick(ds){
  if(ds.wiz==="start"){wizStart();return true;}
  if(ds.wiz==="back"){wizBack();return true;}
  if(ds.wiz==="next"){var ti=document.getElementById("wiz-time");if(ti&&ti.value){svcObj(ti.dataset.wizs)[ti.dataset.wizf]=ti.value;tidy(key(S.cur));}wizNext();return true;}
  if(ds.wiztype){var x=dayRef(),t=ds.wiztype;W.typed=true;
    if(t==="off"){S.days[x.k]={mode:"repos"};saveDays();W=null;renderShift();return true;}
    if(t==="conge"){x.d.mode="conge";delete x.d.midi;delete x.d.soir;delete x.d.cont;tidy(x.k);W=null;renderShift();return true;}
    if(t==="continue"){x.d.mode="continue";delete x.d.midi;delete x.d.soir;}
    else{W.svcs=["midi","soir"];x.d.mode="coupure";delete x.d.cont;}
    tidy(x.k);wizNext();return true;}
  if(ds.wizset){var t=document.getElementById("wiz-time");svcObj(t.dataset.wizs)[t.dataset.wizf]=ds.wizset;tidy(key(S.cur));wizNext();return true;}
  if(ds.wizpause){var st2=wizSteps()[W.i].split(":")[1],o=svcObj(st2);W.pt[st2]=1;o.pause=Math.max(0,Math.min(240,(o.pause||0)+(+ds.wizpause)));
    var out=document.getElementById("wiz-pause");if(out)out.textContent=o.pause+" min";tidy(key(S.cur));return true;}
  if(ds.wizrepas){var s3=wizSteps()[W.i].split(":")[1];svcObj(s3).repas=ds.wizrepas==="1";tidy(key(S.cur));wizNext();return true;}
  return false;
}

/* ===== Page Statistiques ===== */
function renderStats(){
  var now=new Date(),m=monday(S.statW),wEnd=addDays(m,6),y=S.statM.getFullYear(),mo=S.statM.getMonth(),ready=payReady();
  var rows=[],wt=0,wm=0,ws=0,wc=0,wWorked=0,wRep=0,max=600;
  for(var i=0;i<7;i++){var x=addDays(m,i),r=dayCalc(dayOf(x));rows.push({d:x,r:r,data:dayOf(x)||{}});
    wt+=r.total;wm+=r.midi;ws+=r.soir;wc+=r.cont;wRep+=r.repas;if(r.worked)wWorked++;max=Math.max(max,r.total);}
  var mp=rangePlan((function(){var a=[],n=new Date(y,mo+1,0).getDate();for(var q=1;q<=n;q++)a.push(new Date(y,mo,q));return a;})());
  var md=monthData(y,mo),pm=new Date(y,mo-1,1),prev=monthData(pm.getFullYear(),pm.getMonth()),mPay=ready?payCalc(md):null;
  var h='';

  /* --- Salaire --- */
  var det=false;try{det=localStorage.getItem("pt-paydet")==="1";}catch(e){}
  h+='<section class="panel'+(mPay?' pay-panel" data-paypanel role="button" tabindex="0" aria-expanded="'+det+'" aria-label="Afficher ou masquer le détail du salaire':'')+'"><h2>Salaire estimé · '+MOIS[mo]+'</h2>';
  if(mPay){
    h+='<div class="pay-top"><div><span>Brut</span><b>'+eur2(mPay.brut)+'</b></div><div><span>Net</span><b class="'+(mPay.brut>=baseBrut()-0.005?"pay-up":"pay-down")+'">'+eur2(mPay.net)+'</b></div></div>'+
    '<div class="pay-fold'+(det?' open':'')+'"><div class="pay-lines">'+
      '<div><span>Objectif ('+S.target+' h / sem.)</span><b>'+eur2(baseBrut())+' brut</b></div>'+
      '<div><span>Heures normales ('+hh(mPay.normH)+' × '+eur2(mPay.r)+')</span><b>'+eur2(mPay.normH*mPay.r)+'</b></div>'+
      '<div><span>Heures sup ('+hh(mPay.supH)+')</span><b>'+eur2(mPay.sup)+'</b></div>'+
      (mPay.maj>0?'<div><span>dont majorations</span><b>'+eur2(mPay.maj)+'</b></div>':'')+
      (mPay.cp>0?'<div><span>Congés payés ('+jours(md.congeDays)+')</span><b>'+eur2(mPay.cp)+'</b></div>':'')+
      '<div><span>Cotisations ('+String(mPay.ch).replace(".",",")+' %)</span><b>−'+eur2(mPay.brut-mPay.net0)+'</b></div>'+
      (mPay.mealPrice>0?'<div><span>Repas fournis ('+mPay.meals+' × '+eur2(mPay.mealPrice)+')</span><b>−'+eur2(mPay.mealDed)+'</b></div>':'')+
    '</div></div>';}
  else h+='<p class="note">Renseignez votre taux horaire ou votre salaire mensuel dans Paramètres pour voir votre brut et votre net estimés.</p>';
  h+='</section>';

  /* --- Semaine --- */
  var pct=Math.min(100,S.target?wt/(S.target*60)*100:0);
  h+='<div class="cols"><section class="panel" id="sec-semaine"><div class="panel-h"><h2>Semaine</h2><div class="mini-nav"><button data-wk="-1" aria-label="Semaine précédente">'+ICON_L+'</button><span>S'+isoWeek(m)+' · '+shortDate(m)+' – '+shortDate(wEnd)+'</span><button data-wk="1" aria-label="Semaine suivante">'+ICON_R+'</button></div></div>';
  h+='<div class="sec-total"><span class="num">'+fmt(wt)+'</span></div>';
  h+='<div class="progress" aria-hidden="true"><div style="width:'+pct+'%"></div></div>';
  var W=340,H=180,top=18,bot=24,ch=H-top-bot,bw=28,gap=(W-7*bw)/7,scale=ch/max,lbl=["L","M","M","J","V","S","D"];
  var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Heures par jour de la semaine">';
  [240,480].forEach(function(v){if(v<=max){var yy=top+ch-v*scale;g+='<line x1="0" x2="'+W+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-dasharray="3 4"/><text x="'+(W-2)+'" y="'+(yy-3)+'" text-anchor="end">'+(v/60)+'h</text>';}});
  rows.forEach(function(o,i){var x=gap/2+i*(bw+gap),y0=top+ch,acc=0;
    ["cont","midi","soir"].forEach(function(p){var hgt=o.r[p]*scale;if(hgt<=0)return;var gp=acc>0?2:0;
      g+='<rect x="'+x+'" y="'+(y0-acc-gp-hgt)+'" width="'+bw+'" height="'+hgt+'" rx="4" fill="var(--soir)"/>';acc+=hgt+gp;});
    if(o.r.total>0)g+='<text class="val" x="'+(x+bw/2)+'" y="'+(y0-acc-6)+'" text-anchor="middle"'+(dayFlag(o.d)?' style="fill:var(--warn)"':'')+'>'+fmt(o.r.total)+'</text>';
    else if(o.r.conge)g+='<text x="'+(x+bw/2)+'" y="'+(y0-6)+'" text-anchor="middle">CP</text>';
    g+='<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle"'+(sameDay(o.d,now)?' style="fill:var(--ink);font-weight:800"':'')+'>'+lbl[i]+'</text>';});
  g+='<line x1="0" x2="'+W+'" y1="'+(top+ch)+'" y2="'+(top+ch)+'" stroke="var(--line)"/></svg>';
  h+='<div class="chart">'+g+'</div>';
  var wp=rangePlan(rows.map(function(o){return o.d;}));
  h+='<div class="stats"><div class="stat"><span>Moyenne / jour</span><b>'+fmt(wWorked?wt/wWorked:0)+'</b></div><div class="stat"><span>Repas fournis</span><b>'+wRep+'</b></div>'+
    (wp?'<div class="stat"><span>Prévu sur Combo</span><b>'+fmt(wp.plan)+'</b></div><div class="stat"><span>Écart</span><b class="'+(wp.diff>0?"pos":"")+'">'+(wp.diff>0?"+":"")+fmt(wp.diff)+'</b></div>':'')+'</div>';
  h+='<div class="list">'+rows.map(rowHtml).join("")+'</div></section>';

  /* --- Mois --- */
  var diff=md.total-prev.total;
  h+='<section class="panel" id="sec-mois"><div class="panel-h"><h2>Mois</h2><div class="mini-nav"><button data-mo="-1" aria-label="Mois précédent">'+ICON_L+'</button><span>'+MOIS[mo]+' '+y+'</span><button data-mo="1" aria-label="Mois suivant">'+ICON_R+'</button></div></div>';
  h+='<div class="sec-total"><span class="num">'+fmt(md.total)+'</span>'+((md.total||prev.total)?'<span class="cmp '+(diff>0?"plus":diff<0?"minus":"eq")+'">'+(diff>0?"+":"")+fmt(diff)+' par rapport à '+MOIS[pm.getMonth()]+'</span>':'')+'</div>';
  /* prévu à gauche, effectué à droite, repas fournis en dessous sur toute la largeur */
  h+='<div class="stats">'+
    (mp?'<div class="stat"><span>Prévu sur Combo</span><b>'+fmt(mp.plan)+'</b></div>':'')+
    '<div class="stat"><span>Effectué</span><b>'+fmt(md.total)+'</b></div>'+
    '<div class="stat'+(mp?' wide':'')+'"><span>Repas fournis</span><b>'+md.repas+'</b></div>'+
  '</div>';
  h+='</section></div>';

  /* --- Année --- */
  var yy=S.statY,tot={h:0,s:0,b:0,n:0};
  h+='<section class="panel"><div class="panel-h"><h2>Année</h2><div class="mini-nav"><button data-yr="-1" aria-label="Année précédente">'+ICON_L+'</button><span>'+yy+'</span><button data-yr="1" aria-label="Année suivante">'+ICON_R+'</button></div></div>';
  h+='<div class="year'+(ready?' pay':'')+'"><div class="yr head"><span>Mois</span><span>Heures</span><span>H. sup</span>'+(ready?'<span>Brut</span><span>Net</span>':'')+'</div>';
  for(var k=0;k<12;k++){var d2=monthData(yy,k),sp=supHours(d2.weeks),p2=ready&&(d2.total||d2.congeDays)?payCalc(d2):null;
    tot.h+=d2.total;tot.s+=sp;if(p2){tot.b+=p2.brut;tot.n+=p2.net;}
    var empty=!d2.total&&!d2.congeDays,cur=yy===now.getFullYear()&&k===now.getMonth();
    h+='<div class="yr'+(cur?" cur":"")+(empty?" muted":"")+'"><span>'+MOIS_C[k]+'</span><span>'+fmt(d2.total)+'</span><span>'+hh(sp)+'</span>'+(ready?'<span>'+(p2?eur(p2.brut):"")+'</span><span>'+(p2?eur(p2.net):"")+'</span>':'')+'</div>';}
  h+='<div class="yr tot"><span>Total</span><span>'+fmt(tot.h)+'</span><span>'+hh(tot.s)+'</span>'+(ready?'<span>'+eur(tot.b)+'</span><span>'+eur(tot.n)+'</span>':'')+'</div></div>';
  h+='</section>';

  /* --- Congés payés --- */
  var c=congesInfo(now);
  h+='<section class="panel"><h2>Congés payés · depuis le 1er juin '+c.start.getFullYear()+'</h2><div class="stats three">'+
    '<div class="stat"><span>Acquis</span><b>'+jours(c.acq+c.rep)+'</b></div>'+
    '<div class="stat"><span>Pris</span><b>'+jours(c.pris)+'</b></div>'+
    '<div class="stat"><span>Restants</span><b class="'+(c.reste<0?"neg":"")+'">'+jours(c.reste)+'</b></div>'+
  '</div></section>';

  view.innerHTML=h;
}
function svcSub(v){return svcCalc(v)?v.start+" / "+v.end:"";}
function rowHtml(o){var mx=720,r=o.r,d=o.data,act=active(d);
  var sub=r.conge?"Congé payé":r.mode==="repos"?"Repos":act.map(function(s){return svcSub(d[s]);}).filter(Boolean).join(" · ");
  var pdf=planDiff(o.d);if(pdf)sub+=(sub?" · ":"")+"prévu "+fmt(planTotal(key(o.d)));
  var bars='<span class="bline">'+act.map(function(s){return r[s]?'<span class="bar '+CLS[s]+'" style="width:'+Math.min(40,r[s]/mx*55)+'%"></span>'+(d[s].repas===true?'<span class="meal '+CLS[s]+'">repas</span>':''):'';}).join("")+'</span>';
  return '<div class="li"><span class="d">'+JOURS[o.d.getDay()].slice(0,3)+'.<small>'+shortDate(o.d)+'</small></span>'+
    '<span class="bars-row"><span class="bars">'+(r.worked?bars:'')+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</span></span>'+
    '<span class="t'+(r.worked?"":" off")+(dayFlag(o.d)?" warn":"")+'">'+fmt(r.total)+'</span></div>';}

function message(a){var v='<b>'+a.val+'</b>';
  switch(a.kind){
    case "rest":return "Seulement "+v+" de repos avant cette journée. Le minimum légal est de 11 h.";
    case "long":return "Vous avez travaillé "+v+" ce jour-là, au-delà des 10 h maximum par jour.";
    case "amp":return "Votre journée s'est étalée sur "+v+" du premier au dernier service. L'amplitude maximale est de 13 h.";
    case "run":return "C'est votre "+a.val+"ᵉ jour de travail d'affilée. Pensez à prendre votre repos hebdomadaire.";
    case "week":return "Vous avez fait "+v+" cette semaine, au-delà des 48 h maximum.";
    case "today":return "Vous n'avez encore rien pointé aujourd'hui.";
    case "over":return "Vous avez travaillé "+v+" de plus que prévu sur votre planning Combo.";}
  return a.label;}
/* toutes les alertes, dans l'ordre chronologique, chacune avec un identifiant stable */
function allMessages(){var msgs=[];
  weeksWithData().slice().reverse().forEach(function(m){
    weekAlerts(m).forEach(function(a){
      if(a.dt)a.id=a.kind+":"+key(a.dt);
      else{var end=addDays(m,6);a.dt=end>new Date()?new Date():end;a.id="week:"+key(m);}
      msgs.push(a);});});
  if(reminderDue()){var t=new Date();msgs.push({dt:t,kind:"today",val:"",id:"today:"+key(t)});}
  msgs.sort(function(x,y){return key(x.dt)<key(y.dt)?-1:key(x.dt)>key(y.dt)?1:(x.kind==="week")-(y.kind==="week");});
  return msgs;}
/* alertes déjà lues (mémorisées dans ce navigateur) */
function getSeen(){try{return JSON.parse(localStorage.getItem("pt-seen")||"{}")||{};}catch(e){return {};}}
function markSeen(msgs){var seen=getSeen(),ch=false;msgs.forEach(function(a){if(!seen[a.id]){seen[a.id]=1;ch=true;}});try{localStorage.setItem("pt-seen",JSON.stringify(seen));}catch(e){}if(ch)pushProfileSoon();}
function renderAlerts(){
  var msgs=allMessages(),seen=getSeen(),h='<div class="chat">',prevDay=null,open=false,newShown=false;
  function close(){if(open){h+='</div></div>';open=false;}}
  function openGrp(){h+='<div class="grp">'+BOT+'<div class="bubbles">';open=true;}
  if(!msgs.length)h+='<div class="grp">'+BOT+'<div class="bubbles"><p class="bubble">Aucune alerte pour le moment. Je vous écrirai ici si un repos est trop court ou si une journée dépasse les limites.</p></div></div>';
  msgs.forEach(function(a){var k=key(a.dt),isNew=!seen[a.id];
    if(isNew&&!newShown){close();h+='<div class="new-sep" id="new-sep"><span>Nouveaux messages</span></div>';newShown=true;}
    if(k!==prevDay){close();
      var today=sameDay(a.dt,new Date()),yest=sameDay(a.dt,addDays(new Date(),-1));
      h+='<div class="day-sep"><span>'+(today?"Aujourd'hui":yest?"Hier":cap(JOURS[a.dt.getDay()])+" "+a.dt.getDate()+" "+MOIS[a.dt.getMonth()])+'</span></div>';prevDay=k;}
    var first=!open;if(!open)openGrp();
    h+='<p class="bubble'+(isNew?" new":"")+'">'+(first?greet(message(a)):message(a))+'</p>';});
  close();h+='</div>';
  view.innerHTML=h;
  var sep=document.getElementById("new-sep");
  /* défile seulement si la page dépasse l'écran (sur iPhone, un défilement forcé peut décaler l'affichage) */
  var room=document.documentElement.scrollHeight-window.innerHeight;
  if(room>4){var y=sep?sep.getBoundingClientRect().top+window.scrollY-16:room;window.scrollTo(0,Math.max(0,Math.min(room,y)));}
  markSeen(msgs);updateBadge();
}

function dec2(n){return n==null||!isFinite(n)?"":n.toFixed(2).replace(".",",");}
/* les deux champs se remplissent l'un l'autre : celui saisi en dernier fait foi */
function updateEq(skip){
  var P=S.pay,men=P.mode==="mensuel",ok=payReady();
  if(men)P.rate=ok?dec2(hourly()):null;else P.monthly=ok?dec2(baseBrut()):null;
  var ri=document.getElementById("pay-rate"),mi=document.getElementById("pay-monthly");
  if(ri&&ri!==skip)ri.value=P.rate==null?"":P.rate;
  if(mi&&mi!==skip)mi.value=P.monthly==null?"":P.monthly;
}

/* ---------- interactions ---------- */
document.getElementById("prev").onclick=function(){S.cur=addDays(S.cur,-1);W=null;render();};
document.getElementById("next").onclick=function(){S.cur=addDays(S.cur,1);W=null;render();};
function goTab(t){if(t!=="shift"||S.tab!=="shift")W=null;S.tab=t;try{localStorage.setItem("pt-tab",t);}catch(e){}render();window.scrollTo(0,0);}
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){goTab(b.dataset.tab);};});
function keepScroll(fn){var y=window.scrollY;fn();render();window.scrollTo(0,y);}

/* un appui sur la carte du salaire déplie ou replie le détail */
function togglePay(sec){var on=sec.getAttribute("aria-expanded")!=="true";sec.setAttribute("aria-expanded",String(on));
  var pf=sec.querySelector(".pay-fold");if(pf)pf.classList.toggle("open",on);try{localStorage.setItem("pt-paydet",on?"1":"0");}catch(e){}}
document.addEventListener("click",function(e){var pp=e.target.closest("[data-paypanel]");if(pp){togglePay(pp);}});
document.addEventListener("keydown",function(e){var pp=e.target.closest&&e.target.closest("[data-paypanel]");if(pp&&(e.key==="Enter"||e.key===" ")){e.preventDefault();togglePay(pp);}});
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;var ds=t.dataset;
  if("goToday" in ds){S.cur=new Date();W=null;render();return;}
  if(obClick(ds))return;
  if(ds.auth){showAuth(ds.auth);return;}
  if("retry" in ds){var u=USER;USER=null;startUser(u);return;}
  if("logout" in ds){signOut();return;}
  if("hardreload" in ds){hardReload(ds);return;}
  if(wizClick(ds))return;
  if(ds.day){var p=ds.day.split("-");S.cur=new Date(+p[0],+p[1]-1,+p[2]);W=null;render();return;}
  if("combosync" in ds){syncCombo(true);return;}
  if("combooff" in ds){S.combo={url:null,last:null,err:null,count:0};savePlan();renderParams();return;}
  if(ds.wk){keepScroll(function(){S.statW=addDays(S.statW,7*(+ds.wk));});return;}
  if(ds.mo){keepScroll(function(){S.statM=new Date(S.statM.getFullYear(),S.statM.getMonth()+(+ds.mo),1);});return;}
  if(ds.yr){keepScroll(function(){S.statY+=(+ds.yr);});return;}
  if(ds.target){S.target=Math.max(1,Math.min(60,S.target+(+ds.target)));updateEq();saveSettings();var o=document.getElementById("tgt");if(o)o.textContent=S.target+" h";return;}
  if(ds.maj){S.pay.maj=ds.maj;updateEq();saveSettings();renderParams();return;}
  if("remadd" in ds){var ts=S.reminder.times;ts.push(ts.length?"21:00":"22:00");saveSettings();if(OB)renderOnboarding();else renderParams();return;}
  if(ds.remdel){S.reminder.times.splice(+ds.remdel,1);saveSettings();if(OB)renderOnboarding();else renderParams();checkReminder();return;}
  if("export" in ds){exportData();return;}
});
function bkMsg(t){var m=document.getElementById("bk-msg");if(m)m.textContent=t;}
function exportData(){
  var data={app:"iolite",version:3,exportedAt:new Date().toISOString(),days:S.days,settings:settingsObj(),plan:S.plan,combo:{url:S.combo.url}};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="iolite-"+key(new Date())+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},2000);bkMsg("Sauvegarde téléchargée.");
}

view.addEventListener("change",function(e){var i=e.target;
  if(i.id==="combo-url"){S.combo.url=i.value.trim()||null;S.combo.last=null;savePlan();syncCombo(true);return;}
  if(i.id==="ics-file"&&i.files&&i.files[0]){var fr=new FileReader();fr.onload=function(){try{mergePlan(parseICS(fr.result));renderParams();}catch(x){comboMsg("Ce fichier n'est pas un calendrier .ics.");}};fr.readAsText(i.files[0]);i.value="";return;}
  if(i.dataset.remidx){if(i.value){S.reminder.times[+i.dataset.remidx]=i.value;saveSettings();checkReminder();}return;}

  var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!d||(d.app!=="iolite"&&d.app!=="ma-pointeuse")||typeof d.days!=="object")throw 0;
      S.days=d.days||{};applySettings(d.settings);if(d.plan)S.plan=d.plan;if(d.combo&&d.combo.url)S.combo.url=d.combo.url;savePlan();saveDays();saveSettings();
      renderParams();var n=Object.keys(S.days).length;bkMsg(n+(n>1?" journées importées.":" journée importée."));}
    catch(x){bkMsg("Ce fichier n'est pas une sauvegarde iolite.");}};
  r.readAsText(i.files[0]);i.value="";});
view.addEventListener("input",function(e){var i=e.target;
  if(i.dataset.pay){var f=i.dataset.pay;S.pay[f]=i.value.trim()===""?null:i.value.trim();
