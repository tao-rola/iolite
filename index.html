<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iolite</title>
<meta name="theme-color" content="#4A4C95">
<meta name="description" content="iolite version 0.76">
<meta name="application-name" content="iolite">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="iolite">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png" sizes="48x48">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>

:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout : une colonne mobile, en-tête de date en haut, barre d'onglets fixée en bas (Shift / Statistiques / Paramètres). Couleurs de service : midi (soleil), soir (crépuscule), continue (vert d'eau). */
:root{
  --bg:#0D0B17; --surface:rgba(255,255,255,.075); --surface-2:rgba(255,255,255,.06); --ink:#F6F4FF; --muted:rgba(236,233,255,.58); --line:rgba(255,255,255,.14);
  --soir:#A9B0FF; --soir-soft:rgba(169,176,255,.18); --midi:var(--soir); --midi-soft:var(--soir-soft); --cont:var(--soir); --cont-soft:var(--soir-soft);
  --accent:#FFFFFF; --accent-ink:#15122A; --good:#8FE3B8; --warn:#FFA585; --warn-soft:rgba(255,165,133,.16);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.16), inset 0 0 0 1px rgba(255,255,255,.05);
  --f-display:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r:26px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
html{scrollbar-gutter:stable;touch-action:manipulation}
/* pas de zoom au double appui sur téléphone */
body,button,input,label,a{touch-action:manipulation}
[hidden]{display:none!important}
.wrap{width:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.cols{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.cols > *{min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--soir);outline-offset:2px}
p{margin:0}

/* en-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;gap:8px}
.nav-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;flex:none}
.nav-btn svg{width:18px;height:18px}
.top-title{flex:1;min-width:0;text-align:center}
.top-title b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title b::first-letter{text-transform:uppercase}
.top-title small{color:var(--muted);font-size:12.5px}
.today-chip{border:0;background:none;color:var(--soir);font-weight:600;font-size:12.5px;padding:0}

.banner{background:var(--surface);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--muted)}
.banner b{color:var(--ink)}

/* total en vedette */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:4px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.02em}
.hero .side{text-align:right;font-size:13px;color:var(--muted)}
.hero .side b{display:block;color:var(--ink);font-size:15px}

/* sélecteur de type de journée */
.mode{display:grid;grid-template-columns:repeat(3,1fr);border-radius:12px;background:var(--surface);padding:4px;gap:4px}
.mode button{border:0;border-radius:9px;background:none;height:42px;font-weight:600;font-size:14px;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* cartes de service */
.svc{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:14px;}
.svc-head{display:flex;align-items:center;gap:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.d-midi{background:var(--midi)} .d-soir{background:var(--soir)} .d-cont{background:var(--cont)}
.svc-name{font-weight:700;font-size:16px;flex:1}
.svc-net{font-family:var(--f-display);font-weight:500;font-size:18px}
.svc-net.off{color:var(--muted);font-family:var(--f-body);font-size:13px;font-weight:500}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.row-lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.field input{width:100%;min-width:0;height:48px;border-radius:10px;border:0;background:var(--surface-2);color:var(--ink);font:600 20px var(--f-body);padding:0 10px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);font-size:22px;line-height:1;font-weight:500}
.stepper output{min-width:64px;text-align:center;font-weight:700;font-size:17px}
.seg{display:inline-flex;border-radius:999px;overflow:hidden;background:var(--surface-2);padding:3px;gap:3px}
.seg button{border:0;border-radius:999px;background:none;padding:0 18px;height:36px;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.svc-foot{font-size:12.5px;color:var(--muted)}
.svc-foot:empty{display:none}

/* panneaux */
.panel{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:80px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.panel h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.mini-nav{display:flex;align-items:center;gap:4px;min-width:0}
.mini-nav button{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;padding:0;flex:none}
.mini-nav svg{width:14px;height:14px}
.mini-nav span{font-weight:700;font-size:13.5px;text-align:center;padding:0 4px;white-space:nowrap}
.mini-nav span::first-letter{text-transform:uppercase}
.sec-total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-total .num{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.01em}
.sec-total .aside{font-size:13px;color:var(--muted)}


.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:var(--surface-2);border-radius:10px;padding:11px 12px;min-width:0}
.stat span{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat b{display:block;font-size:19px;font-weight:700;margin-top:2px}
.stat i{font-style:normal;font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

.progress{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress div{height:100%;background:var(--accent);border-radius:999px}
.pay-top b.pay-up{color:var(--good)} .pay-top b.pay-down{color:var(--warn)}
.delta{font-weight:700}
.delta.plus{color:var(--good)} .delta.minus{color:var(--warn)}
.target-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}

.chart svg{width:100%;height:auto;max-height:240px;display:block}
.chart text{fill:var(--muted);font:600 11px var(--f-body)}
.chart .val{fill:var(--ink);font-size:10.5px}

.list{display:flex;flex-direction:column;gap:2px}
.li{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:10px 8px;border:0;border-radius:8px;background:none;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .d{font-weight:700;font-size:13.5px}
.li .d::first-letter{text-transform:uppercase}
.li .d small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.li .bars-row{display:flex;align-items:flex-start;gap:8px;min-width:0}
.li .bars{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.li .bline{display:flex;align-items:center;gap:6px;min-height:16px;min-width:0}
.li .bline .meal+.bar{margin-left:4px}
.li .bline .bar{flex:none}
.li .bline .meal{margin-left:0}
.li .bar{height:7px;border-radius:4px;max-width:100%}
.bar.m{background:var(--midi)} .bar.s{background:var(--soir)} .bar.c{background:var(--cont)}
.li .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t{font-weight:700;font-size:15px}
.li .t.off{color:var(--muted);font-weight:500;font-size:13px}
.meal{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:1px;color:var(--ink)}
.meal.m{background:var(--midi-soft)} .meal.s{background:var(--soir-soft)} .meal.c{background:var(--cont-soft)}

.dline{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface-2);border-radius:10px;font-size:14px}
.dlines{display:flex;flex-direction:column;gap:6px}
.dline:first-child{border-top:0}
.dline .info small{display:block;color:var(--muted);font-size:12px}
.dline b{font-size:15px}


.pay-top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay-top div{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.pay-top span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.pay-top b{display:block;font-family:var(--f-display);font-weight:500;font-size:20px;margin-top:2px;white-space:nowrap}
.pay-lines{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.pay-lines div{display:flex;justify-content:space-between;gap:10px}
.pay-lines span:first-child{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}

/* paramètres */
.set{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:14px}
.set h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.set .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-radius:12px}
.set .seg button{padding:0 6px;font-size:13px;border-radius:9px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.set-row .t{font-weight:600}
.set-row .t small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.field-stack{display:flex;flex-direction:column;gap:14px}
.rem-list{display:flex;flex-direction:column;gap:8px}
.rem-row{display:flex;gap:8px;align-items:center}
.rem-row input{flex:1;min-width:0;height:48px;border:0;border-radius:10px;background:var(--surface-2);color:var(--ink);font:600 20px var(--f-body);padding:0 12px;-webkit-appearance:none;appearance:none}
.rem-del{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--surface-2);font-size:20px;color:var(--muted)}
.rem-add{align-self:flex-start;border:0;background:none;padding:2px 0;color:var(--soir);font-weight:600;font-size:14px}
/* récapitulatif et assistant de saisie */
.plan-line{margin:-6px 0 0;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.plan-line b.plus{color:var(--warn)} .plan-line b.minus{color:var(--good)}
.sum-card{gap:4px}
.sum-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
.sum-t{font-weight:700;font-size:15px}
.sum-t small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.sum-v{font-family:var(--f-display);font-weight:500;font-size:18px}
.btn-main,.btn-alt{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border:0;border-radius:14px;font-weight:700;font-size:16px}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-alt{background:var(--surface);color:var(--ink)}
.wiz{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.wiz-bar{height:4px;border-radius:4px;background:var(--surface);overflow:hidden}
.wiz-bar div{height:100%;background:var(--soir);border-radius:4px}
.wiz-eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:-10px}
.wiz-q{margin:0;font-family:var(--f-display);font-weight:500;font-size:24px;line-height:1.25;text-wrap:balance}
.choices{display:flex;flex-direction:column;gap:8px}
.choices.two{flex-direction:row}.choices.two .choice{flex:1;text-align:center}
.choice{border:0;border-radius:14px;background:var(--surface);padding:16px 18px;text-align:left;font-weight:700;font-size:16px}
.choice small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:2px}
.choice.on{background:var(--soir-soft)}
.choice.hi{background:var(--accent);color:var(--accent-ink)}.choice.hi small{color:inherit;opacity:.8}
.wiz-time{width:100%;height:76px;border:0;border-radius:16px;background:var(--surface);color:var(--ink);font:600 38px var(--f-body);text-align:center;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{border:0;border-radius:999px;background:var(--surface);padding:10px 16px;font-weight:600;font-size:15px}
.stepper.big{justify-content:center;gap:18px;padding:8px 0}
.stepper.big button{width:60px;height:60px;font-size:28px;background:var(--surface)}
.stepper.big output{font-size:30px;min-width:120px}
.wiz .field.money input{height:64px;font-size:28px;background:var(--surface)}
.wiz-nav{display:flex;align-items:center;gap:12px;margin-top:8px}
.wiz-nav .btn-main{flex:1}
.wiz-back{border:0;background:none;color:var(--muted);font-weight:600;font-size:15px;padding:14px 6px}
.stat b.pos{color:var(--warn)}
input.txt{font-size:15px!important;font-weight:500!important}
.backup{display:flex;flex-direction:column;gap:8px}
.backup button,.backup .imp{display:flex;align-items:center;justify-content:center;height:46px;border:0;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:14.5px;cursor:pointer}
.backup button{background:var(--accent);color:var(--accent-ink)}
.money{position:relative}
.money input{padding-right:44px}
.money em{position:absolute;right:12px;bottom:14px;font-style:normal;color:var(--muted);font-weight:600}
.maj-list{display:flex;flex-direction:column;gap:8px}
.maj{display:flex;gap:10px;align-items:flex-start;border:0;border-radius:12px;padding:10px 12px;background:var(--surface-2);text-align:left;width:100%}
.maj .radio{width:18px;height:18px;border-radius:50%;background:var(--line);flex:none;margin-top:2px}
.maj[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.maj[aria-pressed="true"] small{color:inherit;opacity:.8}
.maj[aria-pressed="true"] .radio{background:var(--accent-ink);box-shadow:inset 0 0 0 5px var(--accent)}
.maj b{display:block;font-size:14.5px}
.maj small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}

/* barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:430px;z-index:6;background:var(--surface);box-shadow:0 -6px 18px rgba(0,0,0,.06);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:none;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.status{text-align:center;font-size:11.5px;color:var(--muted);padding-top:4px}
@media (prefers-reduced-motion:no-preference){.progress div{transition:width .3s}}

/* alertes, rappel, comparaison, congés, année */
.chat{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.day-sep{display:flex;justify-content:center;margin:12px 0 4px}
.day-sep span{background:var(--surface-2);color:var(--muted);font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px}
.grp{display:flex;align-items:flex-end;gap:8px}
.bot{flex:none;width:30px;height:30px;border-radius:9px;display:block}
.grp .bot{border-radius:0;object-fit:contain}
.bubbles{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:86%}
.bubble{margin:0;background:var(--surface);padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.4}
.bubbles .bubble:last-child{border-bottom-left-radius:6px}
.bubble b{color:var(--warn)}
.new-sep{display:flex;align-items:center;gap:10px;margin:14px 0 2px;color:var(--warn);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;scroll-margin-top:16px}
.new-sep::before,.new-sep::after{content:"";flex:1;height:1px;background:var(--warn);opacity:.35}
.tab-ic{position:relative;display:inline-flex}
.badge{position:absolute;top:-4px;right:-9px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--warn);color:var(--surface);font:700 10px/16px var(--f-body);font-style:normal;text-align:center}
.li .t.warn{color:var(--warn)}
.cmp{font-size:13.5px;font-weight:600}
.cmp.plus{color:var(--good)} .cmp.minus{color:var(--warn)} .cmp.eq{color:var(--muted)}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat.wide{grid-column:1/-1}
.pay-panel{cursor:pointer;-webkit-user-select:none;user-select:none}
/* dépliage animé du détail */
.pay-fold{display:grid;grid-template-rows:0fr;opacity:0;margin-top:-12px;transition:grid-template-rows .38s cubic-bezier(.3,.8,.3,1),opacity .28s ease}
.pay-fold.open{grid-template-rows:1fr;opacity:1}
.pay-fold>.pay-lines{overflow:hidden;min-height:0;padding-top:12px}
@media (prefers-reduced-motion:reduce){.pay-fold{transition:none}}
.pay-panel:active{transform:scale(.995)}
.stat b.neg{color:var(--warn)}
.svc.conge .svc-foot{margin:0}
.year{display:flex;flex-direction:column;gap:2px}
.yr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 10px;border-radius:8px;font-size:13.5px;align-items:center}
.yr span:not(:first-child){text-align:right}
.year.pay .yr{grid-template-columns:.8fr 1fr .9fr 1fr 1fr;gap:6px;padding-inline:8px;font-size:13px}
.yr.head{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding-block:2px 6px}
.yr.cur{background:var(--soir-soft);font-weight:600}
.yr.muted{color:var(--muted)}
.yr.tot{background:var(--surface-2);font-weight:700}

/* ================= iolite · verre dépoli sur nuit lavande ================= */
/* Fond : halos flous lavande, pêche et indigo, fixes derrière tout le contenu */
html{background:#4A4C95} /* couleur du haut de l'écran : iOS s'en sert pour teinter la zone de l'heure */
body{background:transparent!important}
body{padding-block:0 calc(108px + env(safe-area-inset-bottom,0px));font-size:15.5px;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
body::before{display:none}
/* la page fait toujours au moins la hauteur de l'écran (les pages courtes comme Alertes déclenchent un bug d'affichage d'iOS 26) */
body{box-sizing:border-box;min-height:calc(100lvh - env(safe-area-inset-top,0px))}
.progress.hot>div{background:var(--warn)!important}
.acc-links{display:flex;flex-wrap:wrap;gap:4px 18px}
.acc-form{display:flex;flex-direction:column;gap:12px;margin:6px 0 12px}
.acc-err{color:var(--warn);min-height:0}.acc-err:empty{display:none}
p.note.acc-ok{color:var(--good)}
.rem-add.danger{color:var(--warn)}
.backup .danger-btn{background:var(--warn)!important;color:#1A0E0A!important}
.aura{position:fixed;top:0;left:0;right:0;bottom:-240px;z-index:-1;overflow:hidden;background:
  radial-gradient(120% 70% at 50% 0%,#2A2550 0%,rgba(13,11,23,0) 60%),
  linear-gradient(180deg,#1A1630 0%,#0D0B17 55%,#120E1C 100%)}
/* iOS teinte la zone de l'heure avec la couleur d'un élément fixe collé en haut : on lui donne une couleur unie, puis on la fond dans le dégradé */
.sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background-color:#4A4C95;z-index:-1;pointer-events:none}
.aura::after{content:"";position:absolute;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 110px);background:linear-gradient(180deg,#4A4C95 0,#4A4C95 env(safe-area-inset-top,0px),rgba(74,76,149,0) 100%)}
.aura i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.9}
.aura i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,#7C84F0 0%,rgba(124,132,240,0) 65%)}
.aura i:nth-child(2){width:55vmax;height:55vmax;right:-25vmax;top:22vh;background:radial-gradient(circle,#E8907A 0%,rgba(232,144,122,0) 62%);opacity:.55}
.aura i:nth-child(3){width:60vmax;height:60vmax;left:-10vmax;bottom:-35vmax;background:radial-gradient(circle,#5B3FA8 0%,rgba(91,63,168,0) 65%);opacity:.6}
/* fond vivant : les trois halos dérivent lentement, chacun sur son propre trajet */
.aura i{will-change:transform}
.aura i:nth-child(1){animation:orb1 18s ease-in-out infinite}
.aura i:nth-child(2){animation:orb2 23s ease-in-out infinite}
.aura i:nth-child(3){animation:orb3 27s ease-in-out infinite}
@keyframes orb1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20vmax,12vmax) scale(1.15)}66%{transform:translate(-6vmax,24vmax) scale(.9)}}
@keyframes orb2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-26vmax,-14vmax) scale(1.25)}}
@keyframes orb3{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(22vmax,-20vmax) scale(1.12)}80%{transform:translate(-8vmax,-8vmax) scale(.95)}}
@media (prefers-reduced-motion:reduce){.aura i:nth-child(1){animation-duration:40s}.aura i:nth-child(2){animation-duration:50s}.aura i:nth-child(3){animation-duration:60s}}

/* Surfaces de verre */
.svc,.panel,.set,.scard,.prof-card,.choice,.mode,.wiz-time,.bubble,.btn-alt,.nav-cap,.tabs,.maj,.seg,.quick button,.stepper button,.mini-nav button,.rem-row input,.field input,.backup .imp,.rem-del,.day-sep span,.wiz .field.money input{
  background:var(--surface);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:var(--glass-hi)}
.svc,.panel,.set{border-radius:var(--r);padding:18px}
.stat,.pay-top div,.yr.tot,.dline{background:rgba(255,255,255,.055);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);border-radius:16px}
.panel h2,.set h2,.lbl,.row-lbl,.field label,.stat span,.pay-top span,.wiz-eyebrow{color:var(--muted);letter-spacing:.06em}

/* En-tête : grand titre à gauche, capsule à droite */
.top{position:relative;top:auto;background:none;padding-block:22px 4px;align-items:center;gap:12px}
.top-title{text-align:left}
.top-title b{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.top-title b::first-letter{text-transform:none}
.top-title small{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.08em}
.today-chip{text-transform:uppercase;letter-spacing:.06em;font-size:11.5px!important;padding:0;display:inline}
/* titre et capsule sur la 1re ligne, date en majuscules sur toute la largeur en dessous */
.top{display:grid!important;grid-template-columns:1fr auto;align-items:center;column-gap:12px}
.top-title{display:contents}
.top-title b{grid-column:1;grid-row:1;min-width:0}
.nav-cap,.top-logo{grid-column:2;grid-row:1/span 2;align-self:center}
.top-title small{grid-column:1!important;white-space:nowrap;font-size:11.5px!important;letter-spacing:.05em!important}
.top-title small{grid-column:1/-1;grid-row:2;margin-top:6px;letter-spacing:.07em;font-size:12px}
.top.day .top-title b{text-transform:uppercase;letter-spacing:-.01em}
.top{row-gap:0!important}
.top.day .top-title small{margin-top:4px}
/* même taille pour les heures, « Repos » et « Congé payé » */
.big,.big.word{white-space:nowrap;font-size:clamp(36px,13.3vw,52px)!important;letter-spacing:-.035em}
.top-title b{line-height:1}
.big{text-transform:none}
.today-chip{color:var(--soir);font-size:14px;font-weight:600}
.nav-cap{display:flex;gap:2px;padding:4px;border-radius:999px;flex:none}
.nav-cap .nav-btn{width:42px;height:42px;background:none;box-shadow:none;color:var(--ink)}
.top-logo{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 8px 24px rgba(142,151,242,.35)}
.top-logo .bot{width:46px;height:46px;border-radius:50%}

/* Bande des jours */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:-2px}
.sd{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 6px;border-radius:18px;color:var(--muted)}
.sd span{font-size:12px;font-weight:600;letter-spacing:.04em}
.sd b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:600;color:var(--ink)}
.sd i{width:5px;height:5px;border-radius:50%;background:transparent}
.sd i.has{background:var(--soir);box-shadow:0 0 8px var(--soir)}
.sd.now span{color:var(--ink)}
.sd.on b{background:#fff;color:var(--accent-ink);box-shadow:0 0 22px rgba(255,255,255,.45)}

/* Grand total */
.hero{padding-block:14px 2px}
.big{font-family:var(--f-display);font-size:76px;font-weight:600;letter-spacing:-.045em;line-height:.95}
.lbl{font-size:12.5px;font-weight:600;text-transform:uppercase;margin-bottom:6px}
.plan-line{margin:0;font-size:14px}
.plan-line b.plus{color:var(--warn)} .plan-line b.minus{color:var(--good)}

/* Récapitulatif */
.sum-card{padding:8px 18px}
.sum-row{padding:12px 0}
.sum-row+.sum-row{box-shadow:0 -1px 0 rgba(255,255,255,.08)}
.sum-t{font-size:16.5px;font-weight:600}
.sum-t small{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-top:4px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.card-h span{display:flex;align-items:center;gap:8px}
.card-dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.7)}
.card-dot.combo{background:#A9B0FF;box-shadow:0 0 8px #A9B0FF}
.card-h b{font-size:12px;letter-spacing:.06em}.card-h b.plus{color:var(--warn)}.card-h b.minus{color:var(--good)}
.sum-v{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.02em}

/* Boutons */
.btn-main{height:60px;border-radius:999px;background:#fff;color:var(--accent-ink);font-size:17px;font-weight:600;box-shadow:0 12px 34px rgba(169,176,255,.28)}
.btn-main:active{transform:scale(.985)}
.btn-alt{height:60px;border-radius:999px;font-size:17px;font-weight:600}

/* Assistant de saisie */
.wiz{gap:18px;padding-top:8px}
.wiz-bar{height:3px;background:rgba(255,255,255,.12)}
.wiz-bar div{background:#fff;box-shadow:0 0 12px rgba(255,255,255,.6)}
.wiz-eyebrow{font-size:12.5px;margin-bottom:-12px}
.wiz-q{font-family:var(--f-display);font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.12}
.choices{gap:10px}
.choice{position:relative;border-radius:24px;padding:20px 48px 20px 22px;font-size:17px;font-weight:600;color:var(--ink)}
.choice::after{content:"";position:absolute;right:22px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:translateY(-50%) rotate(45deg)}
.choices.two .choice{padding:22px;text-align:center}.choices.two .choice::after{display:none}
.choice small{font-size:13.5px;color:var(--muted)}
.choice.on{background:rgba(255,255,255,.2)}
.choice:active{transform:scale(.99)}
.wiz-time{height:92px;border-radius:28px;font:600 46px var(--f-display);letter-spacing:-.02em;color:var(--ink)}
.quick button{border-radius:999px;padding:11px 18px;font-weight:600;color:var(--ink)}
.stepper.big button{width:64px;height:64px;font-size:30px;color:var(--ink)}
.stepper.big output{font-family:var(--f-display);font-size:40px;font-weight:600;letter-spacing:-.03em}
.wiz-back{color:var(--muted)}

/* Barre d'onglets flottante */
.tabs{left:16px;right:16px;bottom:max(10px,calc(env(safe-area-inset-bottom,0px) - 12px));max-width:398px;border-radius:32px;padding:6px;background:rgba(28,24,46,.55)}
.tabs-in{gap:2px}
.tab{height:56px;border-radius:26px;color:var(--muted)}
.tab[aria-current="page"]{background:rgba(255,255,255,.16);color:var(--ink)}
.badge{background:var(--warn);color:#2A1208}

/* Statistiques */
.sec-total .num{font-family:var(--f-display);font-size:44px;font-weight:600;letter-spacing:-.035em}
.progress{background:rgba(255,255,255,.1);height:6px}
.progress div{background:linear-gradient(90deg,#A9B0FF,#E8B4F0);box-shadow:0 0 14px rgba(169,176,255,.6)}
.chart rect{filter:drop-shadow(0 0 6px rgba(169,176,255,.45))}
.chart text{fill:var(--muted)}
.chart .val{fill:var(--ink)}
.pay-top b{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.02em}
.pay-top b.pay-up{color:var(--good)} .pay-top b.pay-down{color:var(--warn)}
.li{border-radius:14px}
.bar.m,.bar.s,.bar.c{background:linear-gradient(90deg,#A9B0FF,#C9B8FF)}
.meal{background:rgba(255,255,255,.12)!important;color:var(--ink)}
.yr.cur{background:var(--soir-soft)}
.mini-nav button{color:var(--ink)}

/* Alertes */
.bubble{border-radius:22px;font-size:15px}
.bubble b{color:var(--warn)}
.bubbles .bubble:last-child{border-bottom-left-radius:8px}
.new-sep{color:var(--warn)}

/* Réglages */
.field input,.rem-row input{color:var(--ink);border-radius:16px}
.field input::placeholder{color:rgba(236,233,255,.35)}
.seg{padding:4px;border-radius:999px}
.seg button{color:var(--muted)}
.seg button[aria-pressed="true"],.mode button[aria-pressed="true"]{background:#fff;color:var(--accent-ink)}
.maj{border-radius:20px;color:var(--ink)}
.maj[aria-pressed="true"]{background:#fff;color:var(--accent-ink)}
.maj[aria-pressed="true"] .radio{background:var(--accent-ink);box-shadow:inset 0 0 0 5px #fff}
.maj .radio{background:rgba(255,255,255,.2)}
.backup button{height:52px;border-radius:999px;background:#fff;color:var(--accent-ink)}
.backup .imp{height:52px;border-radius:999px;color:var(--ink)}
.backup.two{flex-direction:row;gap:10px}.backup.two button{flex:1;min-width:0}
.backup .soft-danger{background:rgba(255,255,255,.1)!important;color:var(--warn)!important;box-shadow:inset 0 0 0 1.5px rgba(255,165,133,.45)}
.rem-add{color:var(--soir)}
.note{color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}


/* connexion et questionnaire de bienvenue */
body.gate .top,body.gate .tabs{display:none!important}
body.gate{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.auth,.gate-load{display:flex;flex-direction:column;gap:16px;padding-top:48px}
.gate-load{align-items:center;text-align:center;color:var(--muted);padding-top:30vh}
.auth-logo .bot,.gate-load .bot,.ob-done .bot{width:64px;height:64px;border-radius:20px;box-shadow:0 10px 30px rgba(142,151,242,.4)}
.auth-sub{margin:-6px 0 4px;color:var(--muted);font-size:15px;line-height:1.45}
.auth-form{display:flex;flex-direction:column;gap:14px}
.auth-msg{margin:0;min-height:1.2em;font-size:13.5px;color:var(--warn)}
.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.auth-links button{border:0;background:none;padding:6px 0;color:var(--soir);font-weight:600;font-size:14.5px}
.onb{padding-top:28px}
.ob-done{display:flex;justify-content:center;padding:30px 0}
.ob-done .bot{width:96px;height:96px;border-radius:28px}
/* boutons Retour / Suivant fixés en bas de l'écran */
.wiz-nav{position:fixed;left:0;right:0;margin:0 auto;max-width:430px;z-index:7;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  bottom:calc(max(10px,calc(env(safe-area-inset-bottom,0px) - 12px)) + 80px)}
body.gate .wiz-nav{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.wiz{padding-bottom:110px}
body:not(.gate) .wiz{padding-bottom:90px}
/* ================= animations ================= */
@media (prefers-reduced-motion:no-preference){
  /* apparition en douceur du contenu, élément par élément */
  #view>*,.wiz>*,.chat>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  #view>*:nth-child(2),.wiz>*:nth-child(2),.chat>*:nth-child(2){animation-delay:.04s}
  #view>*:nth-child(3),.wiz>*:nth-child(3),.chat>*:nth-child(3){animation-delay:.08s}
  #view>*:nth-child(4),.wiz>*:nth-child(4),.chat>*:nth-child(4){animation-delay:.12s}
  #view>*:nth-child(5),.wiz>*:nth-child(5),.chat>*:nth-child(5){animation-delay:.16s}
  #view>*:nth-child(n+6),.wiz>*:nth-child(n+6),.chat>*:nth-child(n+6){animation-delay:.2s}
  .choices .choice{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
  .choices .choice:nth-child(2){animation-delay:.05s}.choices .choice:nth-child(3){animation-delay:.1s}.choices .choice:nth-child(4){animation-delay:.15s}
  #view>.wiz{animation:none} /* garde les boutons du bas bien fixés */
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* barres de progression qui se remplissent */
  .progress div{transform-origin:left center;animation:fill 1s cubic-bezier(.2,.8,.2,1) .15s both}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .wiz-bar div{animation:wizfill .45s cubic-bezier(.2,.8,.2,1) both}
  @keyframes wizfill{from{width:var(--from,0%)}}
  /* barres du graphique qui montent, l'une après l'autre */
  .chart rect{transform-box:fill-box;transform-origin:center bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
  .chart rect:nth-of-type(2){animation-delay:.05s}.chart rect:nth-of-type(3){animation-delay:.1s}.chart rect:nth-of-type(4){animation-delay:.15s}
  .chart rect:nth-of-type(5){animation-delay:.2s}.chart rect:nth-of-type(6){animation-delay:.25s}.chart rect:nth-of-type(n+7){animation-delay:.3s}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .li .bar{transform-origin:left center;animation:fill .8s cubic-bezier(.2,.8,.2,1) .2s both}
  /* pastilles : jour choisi, points, notification */
  .sd.on b{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
  .sd i.has{animation:glow 2.6s ease-in-out infinite}
  .card-dot{animation:glow 2.6s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.8)}}
  .badge:not([hidden]){animation:pop .5s cubic-bezier(.3,1.6,.5,1) both,ring 2.4s ease-out 1s infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,165,133,.55)}70%,100%{box-shadow:0 0 0 8px rgba(255,165,133,0)}}
  /* onglets, boutons et choix qui réagissent au toucher */
  .tab{transition:background .3s,color .3s,transform .15s}
  .tab:active,.choice:active,.btn-main:active,.sd:active,.quick button:active,.stepper button:active{transform:scale(.96)}
  .choice,.btn-main,.quick button,.stepper button,.sd b{transition:transform .15s,background .25s,box-shadow .25s}
  .tab[aria-current="page"] svg{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
  /* bulles d'alerte qui arrivent comme des messages */
  .bubble{animation:msg .45s cubic-bezier(.2,.8,.2,1) both}
  @keyframes msg{from{opacity:0;transform:translateY(10px) scale(.96);transform-origin:left bottom}to{opacity:1;transform:none}}
}


/* ===== Statistiques : vues colorées ===== */
:root{--c-lav:#A9B0FF;--c-coral:#FFA585;--c-mint:#8FE3B8;--c-lilac:#E3B4F2}
.stv{display:flex;flex-direction:column;gap:14px}
.st-seg{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.st-seg button{height:40px;font-size:14.5px}
.st-hero{position:relative;border-radius:28px;padding:20px;color:var(--ink);background:var(--surface);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:var(--glass-hi);overflow:hidden}
.st-hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.st-hero-t{min-width:0}
.st-hero-t span{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.st-hero-t b{display:block;font-size:clamp(34px,10.5vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:4px}
.st-hero-t small{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-top:2px}
.st-hero-t p{margin:6px 0 0;font-weight:600;opacity:.75}
.st-hero-ring{position:relative;width:92px;height:92px;flex:none}
.st-hero-ring>span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.st-hero-ring b{font-size:20px;font-weight:800;color:var(--c-lav)}.st-hero-ring small{font-size:10px;font-weight:700;color:var(--muted);margin-top:3px;text-align:center;max-width:60px}
.st-hero .pay-fold{margin-top:0}.st-hero .pay-lines{padding-top:14px;border-top:1px solid var(--line);margin-top:14px}
.ring{width:100%;height:100%;display:block}
.ring circle.off{fill:rgba(255,255,255,.14)}.ring circle.on{fill:var(--c-lav)}
.ring.dark circle.off{fill:rgba(21,18,42,.16)}.ring.dark circle.on{fill:#15122A}
.ring.mint circle.on{fill:var(--c-mint)}
.st-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.st-nav span{font-weight:700;font-size:16px}
.st-nav button{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--ink);background:var(--surface);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:var(--glass-hi)}
.st-nav button svg{width:18px;height:18px}
.st-ch-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.st-k{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.st-big{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.up{background:rgba(143,227,184,.16);color:var(--c-mint)}.chip.down{background:rgba(255,165,133,.16);color:var(--c-coral)}.chip.eq{background:rgba(255,255,255,.08);color:var(--muted)}
.st-cmp{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.st-cmp small{color:var(--muted);font-size:12px}
.pb{display:grid;grid-template-columns:repeat(var(--n,7),1fr);gap:8px;height:220px;margin-top:4px;padding-top:34px}
.pb:has(.pb-col:nth-child(12)){--n:12;gap:4px}

.pb:has(.pb-col:nth-child(12)) .pb-l{font-size:12px}
.pb:has(.pb-col:nth-child(12)) .pb-bub{font-size:11px;padding:4px 6px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.cal-leg i.h3{background:var(--c-lav)}.cal-leg i.alert{background:var(--c-coral)}.cal-leg i.cp{background:var(--c-mint)}.cal-leg i.plan{box-shadow:inset 0 0 0 1.5px var(--c-lav)}

}

<script>
(function(){
"use strict";
var SVCS=["midi","soir","cont"], NAMES={midi:"Matin",soir:"Après-midi",cont:"Journée"}, CLS={midi:"m",soir:"s",cont:"c"};
var JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
var MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
var MOIS_C=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
var ICON_L='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>';
var ICON_R='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>';
var DAY_MAX=600, WEEK_MAX=48*60, REST_MIN=660; /* 10 h, 48 h, 11 h */

/* ---------- état ---------- */
var now0=new Date();
var S={tab:"shift",cur:now0,statW:now0,statM:now0,statY:now0.getFullYear(),days:{},target:35,
  pay:{mode:"horaire",rate:"12,31",monthly:null,charges:22,maj:"legal",meal:"4,35"},
  conges:{report:null},reminder:{times:["22:00"],recap:true},
  contract:{type:"cdi",cat:"emp",end:null,essai:true,en:null,eu:null,ren:false,rn:null,ru:null}};
/* à l'ouverture, on arrive toujours sur Shift ; seule la mise à jour depuis Réglages ramène à l'onglet en cours */
try{if(sessionStorage.getItem("pt-keeptab")){sessionStorage.removeItem("pt-keeptab");var t=localStorage.getItem("pt-tab");if(t==="shift"||t==="stats"||t==="alerts"||t==="params")S.tab=t;}}catch(e){}

/* ---------- dates ---------- */
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function monday(d){return addDays(d,-((d.getDay()+6)%7));}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-n+3);var f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7);}
function sameDay(a,b){return key(a)===key(b);}
function shortDate(d){return d.getDate()+" "+MOIS_C[d.getMonth()];}

/* ---------- journées ---------- */
function modeOf(d){var m=d&&d.mode;if(m==="coupure"||m==="continue"||m==="conge"||m==="repos"||m==="abs")return m;return d&&d.cont&&!d.midi&&!d.soir?"continue":"coupure";}
function active(d){var m=modeOf(d);return m==="conge"||m==="repos"||m==="abs"?[]:m==="continue"?["cont"]:["midi","soir"];}
function num(v){var n=parseFloat(String(v==null?"":v).replace(/\s/g,"").replace(",","."));return isFinite(n)&&n>=0?n:null;}
/* une journée « pointée » : au moins un horaire saisi, ou un congé, un repos, une absence */
function entered(d){if(!d)return false;var m=modeOf(d);if(m==="conge"||m==="repos"||m==="abs")return true;return active(d).some(function(s){return d[s]&&(d[s].start||d[s].end);});}
/* absences : k = "work" (temps de travail effectif, compté dans les heures), "paid" (payée, hors heures sup), "unpaid" (non payée par l'employeur) */
var ABS=[
  {id:"ecole",n:"École",sub:"Alternance : cours au centre de formation",k:"work"},
  {id:"formation",n:"Formation",sub:"Prévue par l'employeur",k:"work"},
  {id:"maladie",n:"Arrêt maladie",sub:"Indemnités de la Sécurité sociale à part",k:"unpaid"},
  {id:"at",n:"Accident du travail",sub:"Ou maladie professionnelle",k:"unpaid"},
  {id:"rtt",n:"RTT",sub:"Jour de réduction du temps de travail",k:"paid"},
  {id:"recup",n:"Récupération",sub:"Repos compensateur, heures récupérées",k:"paid"},
  {id:"famille",n:"Événement familial",sub:"Mariage, naissance, décès…",k:"paid"},
  {id:"parent",n:"Maternité, paternité",sub:"Indemnités de la Sécurité sociale à part",k:"unpaid"},
  {id:"sanssolde",n:"Absence non payée",sub:"Congé sans solde, absence autorisée",k:"unpaid"}];
var ABSK={};ABS.forEach(function(a){ABSK[a.id]=a;});
function absOf(d){return d&&modeOf(d)==="abs"?ABSK[d.abs]||null:null;}
function isBlank(d){return !d.midi&&!d.soir&&!d.cont&&modeOf(d)==="coupure";}

/* ---------- calculs d'heures ---------- */
function toMin(s){if(!s||!/^\d{1,2}:\d{2}/.test(s))return null;var p=s.split(":");return (+p[0])*60+(+p[1]);}
function svcCalc(v){
  if(!v)return null;var a=toMin(v.start),b=toMin(v.end);
  if(a==null||b==null)return null;
  var amp=b-a;if(amp<=0)amp+=1440; /* fin après minuit */
  return {amp:amp,net:Math.max(0,amp-(v.pause||0)),a:a,b:a+amp};
}
function dayCalc(d){var r={midi:0,soir:0,cont:0,total:0,worked:false,repas:0,shifts:0,mode:modeOf(d),conge:false};if(!d)return r;
  r.conge=r.mode==="conge";
  var ab=absOf(d);if(ab){r.abs=ab.id;r.absK=ab.k;var am=ab.k==="unpaid"?0:Math.max(0,+d.h||0);
    if(ab.k==="work"){r.total+=am;r.worked=true;r[ab.id]=am;}else if(ab.k==="paid")r.paidAbs=am;return r;}
  active(d).forEach(function(s){var c=svcCalc(d[s]);if(c){r[s]=c.net;r.total+=c.net;r.worked=true;r.shifts++;}if(d[s]&&d[s].repas===true)r.repas++;});return r;}
function dayOf(dt){return S.days[key(dt)];}
/* début et fin de la journée de travail, en minutes depuis minuit du jour */
function bounds(dt){var d=dayOf(dt),lo=null,hi=null;if(!d)return null;
  active(d).forEach(function(s){var c=svcCalc(d[s]);if(!c)return;if(lo==null||c.a<lo)lo=c.a;if(hi==null||c.b>hi)hi=c.b;});
  return lo==null?null:{start:lo,end:hi};}
function restBefore(dt){var a=bounds(addDays(dt,-1)),b=bounds(dt);if(!a||!b)return null;return 1440+b.start-a.end;}
function fmt(m){m=Math.round(m);var neg=m<0;m=Math.abs(m);return (neg?"−":"")+Math.floor(m/60)+"h"+String(m%60).padStart(2,"0");}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function weekTotal(m){var t=0;for(var i=0;i<7;i++)t+=dayCalc(dayOf(addDays(m,i))).total;return t;}

/* ---------- alertes : toutes regroupées sur la page Alertes ---------- */
var AMP_MAX=780; /* 13 h d'amplitude */
function cap(t){return t.replace(/^./,function(c){return c.toUpperCase();});}
function shortDay(dt){return cap(JOURS[dt.getDay()].slice(0,3))+". "+dt.getDate();}
function amplitude(dt){var b=bounds(dt);return b?b.end-b.start:0;}
function runBefore(dt){var n=0;for(var d=dt;n<31&&dayCalc(dayOf(d)).worked;d=addDays(d,-1))n++;return n;}
/* alertes d'une semaine (lundi m) : {dt, label, val} ; dt null = toute la semaine */
function weekAlerts(m){var out=[],wt=weekTotal(m);
  for(var i=0;i<7;i++){var dt=addDays(m,i),r=dayCalc(dayOf(dt));if(!r.worked)continue;
    var rb=restBefore(dt);if(rb!=null&&rb<REST_MIN)out.push({dt:dt,kind:"rest",label:"Repos trop court",val:fmt(rb)});
    if(r.total>DAY_MAX)out.push({dt:dt,kind:"long",label:"Plus de 10 h de travail",val:fmt(r.total)});
    var a=amplitude(dt);if(a>AMP_MAX)out.push({dt:dt,kind:"amp",label:"Amplitude de plus de 13 h",val:fmt(a)});
    var run=runBefore(dt);if(run>=7)out.push({dt:dt,kind:"run",label:run+"ᵉ jour travaillé d'affilée",val:String(run)});
    var pd=planDiff(dt);if(pd!=null&&pd>=30&&key(dt)<=key(new Date()))out.push({dt:dt,kind:"over",label:"Plus que prévu",val:fmt(pd)});}
  if(wt>WEEK_MAX)out.push({dt:null,kind:"week",label:"Plus de 48 h de travail",val:fmt(wt)});
  return out;}
function dayFlag(dt){var r=dayCalc(dayOf(dt)),rb=restBefore(dt);return r.total>DAY_MAX||(rb!=null&&rb<REST_MIN);}
/* semaines qui contiennent des pointages, de la plus récente à la plus ancienne */
function weeksWithData(){var set={};Object.keys(S.days).forEach(function(k){var p=k.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);if(dayCalc(S.days[k]).worked)set[key(monday(d))]=monday(d);});
  return Object.keys(set).sort().reverse().map(function(k){return set[k];});}
function alertCount(){var seen=getSeen();return allMessages().filter(function(m){return !seen[m.id];}).length;}
function updateBadge(){var b=document.getElementById("al-badge");if(!b)return;var n=alertCount();b.hidden=!n;b.textContent=n>9?"9+":n;}

/* ---------- salaire (estimation) ---------- */
var MAJ={legal:[[35,1],[43,1.25],[1e9,1.5]],hcr:[[35,1],[39,1.10],[43,1.20],[1e9,1.5]],none:[[1e9,1]]};
/* majoration personnalisée : taux de sa convention ou de son accord d'entreprise */
function majCustom(){var c=S.pay.majc||{},t1=num(c.t1),h1=num(c.h1),t2=num(c.t2);if(!(t1>=0))t1=25;if(!(h1>35))h1=43;if(!(t2>=0))t2=50;return [[35,1],[h1,1+t1/100],[1e9,1+t2/100]];}
/* conventions courantes qui appliquent les taux du Code du travail (+25 % puis +50 %) */
var CONV=[["rapide","Restauration rapide","IDCC 1501"],["collect","Restauration de collectivités","IDCC 1266"],["alim","Commerce de détail et de gros à prédominance alimentaire","IDCC 2216"],
  ["syntec","Bureaux d'études techniques (Syntec)","IDCC 1486"],["metal","Métallurgie","IDCC 3248"],["btp","Bâtiment (ouvriers)","IDCC 1596 / 1597"]];
/* repas fournis par l'entreprise : sans réponse (anciens comptes) on garde la question */
/* journées coupées (matin et après-midi séparés) : sans réponse (anciens comptes) on garde le choix */
function splitOn(){return S.pay.split!==false;}
function mealsOn(){return S.pay.mealsOn!==false;}
function factor(h){var t=S.pay.maj==="custom"?majCustom():(MAJ[S.pay.maj]||MAJ.legal);for(var i=0;i<t.length;i++)if(h<=t[i][0])return t[i][1];return 1;}
function payReady(){return S.pay.mode==="mensuel"?num(S.pay.monthly)>0:num(S.pay.rate)>0;}
/* brut d'une semaine de h heures payée 1 €/h, majorations comprises */
function weekUnits(h){var u=Math.min(h,35),cuts=[35,39,43,h].filter(function(x){return x>=35&&x<=h;});
  for(var i=0;i<cuts.length-1;i++){var a=cuts[i],b=cuts[i+1];if(b>a)u+=(b-a)*factor((a+b)/2);}return u;}
/* au mois : taux horaire tel que les heures du contrat donnent exactement le fixe */
function hourly(){return S.pay.mode==="mensuel"?num(S.pay.monthly)/(weekUnits(S.target)*52/12):num(S.pay.rate);}
function supHours(weeks){var s=0;weeks.forEach(function(m){s+=Math.max(0,m/60-35);});return s;}
/* salaire construit à partir des heures pointées ; un jour de congé compte pour 1/6 des heures du contrat */
function payCalc(md){
  var P=S.pay,r=hourly(),brut=0,normH=0,supH=0,maj=0,sup=0;
  md.weeks.forEach(function(m){var h=m/60,n=Math.min(h,35);normH+=n;brut+=n*r;
    if(h<=35)return;
    var cuts=[35,39,43,h].filter(function(x){return x>=35&&x<=h;});
    for(var i=0;i<cuts.length-1;i++){var a=cuts[i],b=cuts[i+1];if(b<=a)continue;var f=factor((a+b)/2),amt=(b-a)*r*f;brut+=amt;
      supH+=b-a;maj+=(b-a)*r*(f-1);sup+=amt;}
  });
  var cp=(md.congeH||0)*r;brut+=cp;
  /* jours fériés chômés (maintien du salaire) et absences payées (RTT, récupération, événement familial) */
  var fer=(md.ferInWeeks?0:(md.ferPaidH||0))*r,absP=(md.absPaidH||0)*r;brut+=fer+absP;
  /* majorations de nuit, du dimanche et des jours fériés travaillés */
  var xm=(md.majH||0)*r;brut+=xm;
  var ch=num(P.charges);if(ch==null)ch=22;
  /* repas fourni = avantage en nature : ajouté au brut (soumis aux cotisations), puis retiré du net, comme sur la fiche de paie */
  var mp=mealsOn()?(num(P.meal)||0):0,an=mp*(md.repas||0),base=brut;brut+=an;var net0=brut*(1-ch/100),ap=apprSeuil();
  if(ap){var seuil=ap.pct/100*SMIC_M*(md.days||30.44)*12/365,chA=ap.old?Math.max(0,ch-9.7):ch;net0=brut-chA/100*Math.max(0,brut-seuil);}
  return {brut:brut,base:base,an:an,net0:net0,net:net0-an,mealDed:an,meals:md.repas||0,mealPrice:mp,r:r,normH:normH,supH:supH,maj:maj,sup:sup,ch:ch,cp:cp,
    fer:fer,ferH:md.ferInWeeks?0:(md.ferPaidH||0),absP:absP,absH:md.absPaidH||0,xm:xm,night:md.night||0,sun:md.sun||0,ferW:md.fer||0,solid:md.solid||0};
}
function baseBrut(){return S.pay.mode==="mensuel"?num(S.pay.monthly):num(S.pay.rate)*weekUnits(S.target)*52/12;}
function eur(n){return n.toLocaleString("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});}
function eur2(n){return n.toLocaleString("fr-FR",{style:"currency",currency:"EUR"});}
function hh(h){return fmt(h*60);}

/* ---------- jours fériés (Code du travail, art. L3133-1) ---------- */
function easter(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
  i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),x=h+l-7*m+114;return new Date(y,Math.floor(x/31)-1,(x%31)+1);}
var REGIONS=[["metro","France métropolitaine",""],["alsace","Alsace-Moselle","+ Vendredi saint et 26 décembre"],["gp","Guadeloupe","+ 27 mai"],["mq","Martinique","+ 22 mai"],
  ["gf","Guyane","+ 10 juin"],["re","La Réunion","+ 20 décembre"],["yt","Mayotte","+ 27 avril"]];
var FER_CACHE={};
function ferReg(){return S.pay.reg||"metro";}
function solidOn(){return false;} /* journée de solidarité retirée des réglages */
function feriesFor(y,rg){var o=S.pay.reg;S.pay.reg=rg;try{return feries(y);}finally{S.pay.reg=o;}}
function feries(y){var rg=ferReg(),ck=y+rg;if(FER_CACHE[ck])return FER_CACHE[ck];var e=easter(y),o={};
  function add(d,n){o[key(d)]=n;}
  add(new Date(y,0,1),"Jour de l'an");add(addDays(e,1),"Lundi de Pâques");add(new Date(y,4,1),"Fête du Travail");add(new Date(y,4,8),"Victoire de 1945");
  add(addDays(e,39),"Ascension");add(addDays(e,50),"Lundi de Pentecôte");add(new Date(y,6,14),"Fête nationale");add(new Date(y,7,15),"Assomption");
  add(new Date(y,10,1),"Toussaint");add(new Date(y,10,11),"Armistice de 1918");add(new Date(y,11,25),"Noël");
  if(rg==="alsace"){add(addDays(e,-2),"Vendredi saint");add(new Date(y,11,26),"Saint-Étienne");}
  var ab={gp:[4,27],mq:[4,22],gf:[5,10],re:[11,20],yt:[3,27]}[rg];if(ab)add(new Date(y,ab[0],ab[1]),"Abolition de l'esclavage");
  return FER_CACHE[ck]=o;}
function isPentecote(dt){return key(dt)===key(addDays(easter(dt.getFullYear()),50));}
function isSolid(dt){return solidOn()&&isPentecote(dt);}
/* nom du jour férié, sauf le lundi de Pentecôte quand il sert de journée de solidarité */
function ferName(dt){if(isSolid(dt))return null;return feries(dt.getFullYear())[key(dt)]||null;}
function isMay1(dt){return dt.getMonth()===4&&dt.getDate()===1;}
/* ancienneté en mois à une date donnée (contrat inconnu : on considère la condition remplie) */
function seniority(dt){var cs=contractStart();if(!cs)return 999;return (dt.getFullYear()-cs.getFullYear())*12+dt.getMonth()-cs.getMonth()-(dt.getDate()<cs.getDate()?1:0);}

/* ---------- nuit, dimanche, jours fériés : règles de chaque convention ----------
   fer : majoration d'un jour férié travaillé (hors 1er mai, toujours payé double) ; ferSen : ancienneté requise en mois
   night : plage de nuit [début, fin] en minutes ; nb : tranches majorées [début, fin, %] ; sun : majoration du dimanche ; max : majorations non cumulables */
var EXT={
  legal:{fer:0,night:[1260,360],nb:[],sun:0,
    fn:"Le Code du travail ne prévoit pas de majoration pour un jour férié travaillé, sauf le 1er mai, payé double. Votre convention ou votre entreprise peut prévoir mieux.",
    nn:"Travail de nuit : de 21 h à 6 h. La loi n'impose pas de majoration de salaire : les travailleurs de nuit ont droit à un repos compensateur, et souvent à une majoration prévue par accord.",
    sn:"Pas de majoration légale en général. Exception : dans un commerce de détail ouvert un « dimanche du maire », le salaire de la journée est doublé."},
  hcr:{fer:100,ferSen:12,night:[1320,420],nb:[],sun:0,
    fn:"Après 1 an d'ancienneté, un jour férié travaillé est compensé par un jour de repos ou par une indemnité : iolite le compte comme +100 %. Le 1er mai travaillé est payé double.",
    nn:"Travail de nuit : de 22 h à 7 h. La convention n'impose pas de majoration de salaire : les travailleurs de nuit ont 1 % de repos compensateur par heure de nuit.",
    sn:"La convention HCR ne prévoit pas de majoration du dimanche."},
  rapide:{fer:0,night:[1320,420],nb:[[0,120,10],[120,360,30]],sun:0,
    fn:"Après 1 an d'ancienneté, les jours fériés chômés sont payés. La convention ne chiffre pas la majoration d'un jour férié travaillé (repos ou paiement, au choix de l'employeur) : saisissez votre taux si vous le connaissez. Le 1er mai travaillé est payé double.",
    nn:"Travail de nuit : de 22 h à 7 h. +10 % de minuit à 2 h, +30 % de 2 h à 6 h (niveaux I à IV).",

function rangeData(dates){

/* ---------- congés payés : période du 1er juin au 31 mai, 2,5 jours ouvrables par mois ---------- */
/* depuis le début du contrat : acquis mois par mois (30 jours au plus par période juin-mai), moins tous les congés pointés */
function congesContrat(today,cs){var acq=0,per={},pris=0;
  for(var m=new Date(cs.getFullYear(),cs.getMonth(),1);m<new Date(today.getFullYear(),today.getMonth(),1);m=new Date(m.getFullYear(),m.getMonth()+1,1)){
    var py=m.getMonth()>=5?m.getFullYear():m.getFullYear()-1,a=monthAcq(m),room=30-(per[py]||0),g=Math.min(a,Math.max(0,room));per[py]=(per[py]||0)+g;acq+=g;}

/* jours ouvrables (lundi au samedi) entre deux dates incluses */
function ouvrables(a,b){var n=0;for(var d=new Date(a);d<=b;d=addDays(d,1))if(d.getDay()!==0)n++;return n;}

/* congés acquis sur un mois terminé : 2,5 jours par mois complet ; le premier mois est compté au prorata (24 jours ouvrables = 1 mois) */
function monthAcq(m){var cs=contractStart(),end=new Date(m.getFullYear(),m.getMonth()+1,0);

/* absences sur le mois : arrêt maladie (non professionnel) = 2 jours acquis par mois au lieu de 2,5 (loi du 22 avril 2024) ;

function cloudErr(){setStatus("La base en ligne ne répond pas. Vos saisies restent sur ce téléphone et partiront à la prochaine connexion.");}
function firstName(){return (PROFILE.first_name||"").trim();}
/* « Tao, vous avez… » quand le prénom est connu */
function greet(t){var n=firstName();return n?n+", "+t.charAt(0).toLowerCase()+t.slice(1):t;}

function saveProfileLocal(){lsSet("pt-profile",JSON.stringify(PROFILE));}
function pushDays(){if(!cloudReady)return;var up=[],del=[],now=new Date().toISOString(),all=allDaysMap();
  Object.keys(all).forEach(function(k){var j=JSON.stringify(all[k]);if(cloudSnap[k]!==j)up.push({user_id:USER.id,day:k,data:all[k],updated_at:now});});
  Object.keys(cloudSnap).forEach(function(k){if(!all[k])del.push(k);});
  var jobs=[];
  if(up.length)jobs.push(SB.from("days").upsert(up).then(function(r){if(r.error)throw r.error;up.forEach(function(x){cloudSnap[x.day]=JSON.stringify(x.data);});}));
  if(del.length)jobs.push(SB.from("days").delete().eq("user_id",USER.id).in("day",del).then(function(r){if(r.error)throw r.error;del.forEach(function(k){delete cloudSnap[k];});}));
  if(jobs.length)Promise.all(jobs).then(function(){setStatus("");}).catch(cloudErr);}
function pushProfile(extra){saveProfileLocal();if(!cloudReady)return Promise.resolve();
  var row=Object.assign({id:USER.id,first_name:PROFILE.first_name,last_name:PROFILE.last_name,settings:settingsObj(),seen:getSeen(),onboarded:!!PROFILE.onboarded,updated_at:new Date().toISOString()},extra||{});
  if(PHONE_COL)row.phone=PROFILE.phone||null;
  return SB.from("profiles").upsert(row).then(function(r){if(r.error)throw r.error;}).catch(function(e){var m=String(e&&e.message||"");
    if(/phone/i.test(m)&&/column|schema/i.test(m)&&PHONE_COL){PHONE_COL=false;return pushProfile(extra);}
    if(/duplicate|unique|23505/i.test(m+(e&&e.code||""))){PHONE_TAKEN=true;var pm=document.getElementById("ob-msg")||document.getElementById("pf-msg");if(pm)pm.textContent="Ce numéro est déjà utilisé par un autre compte.";return;}
    cloudErr(e);});}
var PHONE_TAKEN=false;
function pushProfileSoon(){clearTimeout(timers.p);timers.p=setTimeout(pushProfile,800);}
function pushPlan(){if(!cloudReady)return;
  var mc=mainCombo();SB.from("plans").upsert({user_id:USER.id,data:allPlanData(),combo:comboPub(mc),updated_at:new Date().toISOString()})
    .then(function(r){if(r.error)throw r.error;}).catch(cloudErr);}
function pullAll(){var u=USER.id;
  return Promise.all([SB.from("profiles").select("*").eq("id",u).maybeSingle(),SB.from("days").select("day,data").eq("user_id",u),SB.from("plans").select("data,combo").eq("user_id",u).maybeSingle()])
    .then(function(rs){rs.forEach(function(r){if(r.error)throw r.error;});return {profile:rs[0].data,days:rs[1].data||[],plan:rs[2].data};});}
/* efface ce que le navigateur garde (changement de compte, déconnexion) */
function resetLocal(){["pt-days","pt-settings","pt-plan","pt-combo","pt-seen","pt-profile","pt-notified"].forEach(function(k){lsSet(k,null);});
  lsSet("pt-job",null);JOBS=[{id:"main",name:""}];JOB="main";JCFG={};S.days={};JDAYS={main:S.days};S.plan={};S.combo=emptyCombo();JPLAN={main:{plan:S.plan,combo:S.combo}};
  PROFILE={first_name:"",last_name:"",phone:"",onboarded:false};
  if(DEFAULTS){var d=JSON.parse(DEFAULTS);cfgSet(defCfg());S.reminder=d.reminder;}JCFG.main=cfgNow();}
function cacheLocal(){lsSet("pt-days",JSON.stringify(allDaysMap()));lsSet("pt-settings",JSON.stringify(settingsObj()));savePlanLocal();saveProfileLocal();}

/* ---------- démarrage ---------- */
function boot(){
  DEFAULTS=JSON.stringify({target:S.target,pay:S.pay,conges:S.conges,reminder:S.reminder,contract:S.contract});
  load();loadPlan();restoreJob();try{PROFILE=Object.assign(PROFILE,JSON.parse(lsGet("pt-profile")||"{}"));}catch(e){}
  if(!cloudOn()){ /* mode sans compte */
    if(!PROFILE.onboarded)startOnboarding();else enterApp();return;}
  if(!window.supabase||!window.supabase.createClient){ /* bibliothèque indisponible (hors ligne) */
    if(lsGet("pt-owner")&&PROFILE.onboarded){enterApp();setStatus("Hors ligne : vos saisies seront envoyées à la prochaine connexion.");}
    else showAuth("login","Connexion impossible pour le moment. Vérifiez votre réseau.");return;}
  SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  SB.auth.onAuthStateChange(function(ev,session){
    if(ev==="PASSWORD_RECOVERY"){showAuth("reset");return;}
    if(ev==="SIGNED_IN"&&session&&!USER)startUser(session.user);});
  SB.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(s)startUser(s.user);else if(!USER)showAuth("login");})
    .catch(function(){showAuth("login");});
}
function startUser(user){
  if(USER&&USER.id===user.id)return;USER=user;cloudReady=false;gate(true);
  view.innerHTML='<div class="gate-load">'+BOT+'<p>Chargement de vos données…</p></div>';
  pullAll().then(function(r){
    var owner=lsGet("pt-owner");
    if(owner&&owner!==user.id)resetLocal();              /* autre compte sur ce téléphone */
    if(r.days.length){var mp={};r.days.forEach(function(x){mp[x.day]=x.data;});setAllDays(mp);}
    /* premier passage : les saisies faites sur ce téléphone sans compte sont gardées et envoyées */
    cloudSnap={};r.days.forEach(function(x){cloudSnap[x.day]=JSON.stringify(x.data);});
    if(r.profile){PROFILE={first_name:r.profile.first_name||"",last_name:(r.profile.last_name||"").toUpperCase(),phone:r.profile.phone||"",onboarded:!!r.profile.onboarded};
      applySettings(r.profile.settings);if(r.profile.seen)lsSet("pt-seen",JSON.stringify(Object.assign(getSeen(),r.profile.seen)));}
    else if(owner!==user.id){PROFILE.onboarded=false;}
    if(r.plan)setAllPlan(r.plan.data,r.plan.combo);
    restoreJob();lsSet("pt-owner",user.id);cloudReady=true;cacheLocal();
    pushDays();if(!r.plan&&(S.combo.url||Object.keys(S.plan).length))pushPlan();
    if(!PROFILE.phone&&user.user_metadata&&user.user_metadata.phone)PROFILE.phone=user.user_metadata.phone;
    if(!PROFILE.onboarded)startOnboarding();else if(!PROFILE.phone||!PROFILE.first_name||!PROFILE.last_name)startOnboarding(true);else{enterApp();}
  }).catch(function(){
    if(lsGet("pt-owner")===user.id&&PROFILE.onboarded){enterApp();cloudErr();}
    else{view.innerHTML='<div class="gate-load">'+BOT+'<p>Impossible de joindre la base en ligne.</p><button class="btn-main" data-retry>Réessayer</button></div>';}
  });
}
function gate(on){document.body.classList.toggle("gate",on);if(on){document.body.classList.remove("fixtop");document.getElementById("dayhead").innerHTML="";}}
function enterApp(){OB=null;gate(false);render();mirror();autoSync();checkReminder();}
function signOut(){var go=function(){SUB=null;resetLocal();lsSet("pt-owner",null);USER=null;cloudReady=false;W=null;showAuth("login","Vous êtes déconnecté.");};
  if(SB)SB.auth.signOut().then(go,go);else go();}

/* ---------- écrans de connexion ---------- */
var AUTHMODE="login";
function authErr(e){var m=(e&&e.message)||"";
  if(/invalid login/i.test(m))return "E-mail ou mot de passe incorrect.";
  if(/already registered|already exists/i.test(m))return "Un compte existe déjà avec cet e-mail. Connectez-vous.";
  if(/at least 6|password should/i.test(m))return "Le mot de passe doit faire au moins 6 caractères.";
  if(/not confirmed/i.test(m))return "Confirmez d'abord votre adresse avec le lien reçu par e-mail.";
  if(/invalid.*email|email.*invalid/i.test(m))return "Cette adresse e-mail n'est pas valide.";
  if(/rate|too many/i.test(m))return "Trop d'essais. Patientez une minute avant de recommencer.";
  if(/fetch|network/i.test(m))return "Pas de connexion internet.";
  return "Une erreur est survenue. Réessayez.";}
function showAuth(mode,msg){AUTHMODE=mode;gate(true);
  var t={login:["Connexion","Retrouvez vos heures sur tous vos appareils."],signup:["Créer un compte","Vos heures, votre salaire, votre planning, au même endroit."],
    forgot:["Mot de passe oublié","Recevez un lien pour en choisir un nouveau."],reset:["Nouveau mot de passe","Choisissez votre nouveau mot de passe."],
    check:["Vérifiez vos e-mails","Ouvrez le lien reçu pour confirmer votre adresse, puis revenez ici."]}[mode];
  var h='<div class="auth"><div class="auth-logo">'+BOT+'</div><h1 class="wiz-q">'+t[0]+'</h1><p class="auth-sub">'+t[1]+'</p>';
  if(mode!=="check"){h+='<form class="auth-form" id="auth-form" novalidate>';
    if(mode==="login")h+='<div class="field"><label for="au-mail">E-mail ou téléphone</label><input id="au-mail" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>';
    else if(mode!=="reset")h+='<div class="field"><label for="au-mail">E-mail</label><input id="au-mail" type="email" autocomplete="email" inputmode="email" required></div>';
    if(mode==="signup")h+='<div class="field"><label for="au-tel">Téléphone</label><input id="au-tel" type="tel" autocomplete="tel" inputmode="tel" placeholder="06 12 34 56 78" required></div>';
    if(mode!=="forgot")h+='<div class="field"><label for="au-pass">Mot de passe</label><div class="pw-wrap"><input id="au-pass" type="password" autocomplete="'+(mode==="login"?"current-password":"new-password")+'" minlength="6" required>'+eyeBtn("au-pass")+'</div></div>';
    h+='<p class="auth-msg" id="au-msg" role="alert">'+esc(msg||"")+'</p>';
    h+='<button class="btn-main" type="submit">'+{login:"Se connecter",signup:"Créer mon compte",forgot:"Envoyer le lien",reset:"Enregistrer"}[mode]+'</button></form>';}
  else h+='<p class="auth-msg" id="au-msg">'+esc(msg||"")+'</p>';
  h+='<div class="auth-links">'+
    (mode==="login"?'<button data-auth="signup">Créer un compte</button><button data-auth="forgot">Mot de passe oublié ?</button>':'<button data-auth="login">J\'ai déjà un compte</button>')+'</div></div>';
  view.innerHTML=h;var f=document.getElementById("au-mail")||document.getElementById("au-pass");if(f&&mode!=="login")f.focus();}
function authSubmit(){
  var mail=(document.getElementById("au-mail")||{}).value,pass=(document.getElementById("au-pass")||{}).value,msg=document.getElementById("au-msg"),btn=view.querySelector(".auth-form .btn-main");
  function say(t){msg.textContent=t;btn.disabled=false;}
  mail=(mail||"").trim();var tel=null;
  if(AUTHMODE==="login"&&isPhoneLike(mail)){tel=normPhone(mail);if(!tel)return say("Ce numéro de téléphone n'est pas valide.");}
  else if(AUTHMODE!=="reset"&&!/^\S+@\S+\.\S+$/.test(mail||""))return say(AUTHMODE==="login"?"Indiquez votre e-mail ou votre numéro de téléphone.":"Indiquez une adresse e-mail valide.");
  if(AUTHMODE==="signup"){tel=normPhone((document.getElementById("au-tel")||{}).value);if(!tel)return say("Indiquez un numéro de téléphone valide.");}
  if(AUTHMODE!=="forgot"&&(!pass||pass.length<6))return say("Le mot de passe doit faire au moins 6 caractères.");
  btn.disabled=true;msg.textContent="";var back=location.origin+location.pathname;
  if(AUTHMODE==="login"&&tel){ /* connexion par téléphone : la base retrouve l'e-mail du compte, seulement si le mot de passe est le bon */
    SB.rpc("login_email",{p_phone:tel,p_pass:pass}).then(function(r){if(r.error||!r.data)return say(r.error&&/function|login_email/i.test(r.error.message||"")?"La connexion par téléphone n'est pas encore activée. Utilisez votre e-mail.":"Téléphone ou mot de passe incorrect.");
      SB.auth.signInWithPassword({email:r.data,password:pass}).then(function(x){if(x.error)return say(authErr(x.error));startUser(x.data.user);});});}
  else if(AUTHMODE==="login")SB.auth.signInWithPassword({email:mail,password:pass}).then(function(r){if(r.error)return say(authErr(r.error));startUser(r.data.user);});
  else if(AUTHMODE==="signup")SB.auth.signUp({email:mail,password:pass,options:{emailRedirectTo:back,data:{phone:tel}}}).then(function(r){if(r.error)return say(authErr(r.error));PROFILE.phone=tel;saveProfileLocal();
      if(r.data.session)startUser(r.data.user);else showAuth("check","Lien envoyé à "+mail+".");});
  else if(AUTHMODE==="forgot")SB.auth.resetPasswordForEmail(mail,{redirectTo:back}).then(function(r){if(r.error)return say(authErr(r.error));showAuth("check","Si un compte existe pour "+mail+", un lien vient d'être envoyé.");});
  else if(AUTHMODE==="reset")SB.auth.updateUser({password:pass}).then(function(r){if(r.error)return say(authErr(r.error));SB.auth.getSession().then(function(x){var s=x.data&&x.data.session;if(s){USER=null;startUser(s.user);}else showAuth("login","Mot de passe modifié. Connectez-vous.");});});
}

function obClick(ds){
  if(!OB)return false;
  if(ds.obsplit){S.pay.split=ds.obsplit==="1";saveSettings();renderOnboarding();return true;}
  if(ds.obmeal){S.pay.mealsOn=ds.obmeal==="1";saveSettings();renderOnboarding();return true;}
  if(ds.obct){ctPick(ds.obct);saveSettings();renderOnboarding();return true;}
  if(ds.obmaj){S.pay.maj=ds.obmaj;updateEq();saveSettings();renderOnboarding();return true;}
  if(ds.reg){S.pay.reg=ds.reg;FER_CACHE={};saveSettings();renderOnboarding();return true;}

  var g=os.get("state");g.onsuccess=function(){var st=g.result||{};out=fn(st);os.put(st,"state");};tx.oncomplete=function(){res(out);};tx.onerror=function(){res(false);};});});}

function congesCard(){var c=congesInfo(new Date()),tot=c.acq+c.rep,pct=tot>0?Math.max(0,c.reste)/tot:0;

function renderStats(){
  var now=new Date(),ready=payReady(),h='';

  if(STV==="week"){
    var m=monday(S.statW),wEnd=addDays(m,6),rows=[],wt=0,wWorked=0,wRep=0,L=["L","M","M","J","V","S","D"];
    for(var i=0;i<7;i++){var x=addDays(m,i),r=dayCalc(dayOf(x));rows.push({d:x,r:r,data:dayOf(x)||{}});wt+=r.total;wRep+=r.repas;if(r.worked)wWorked++;}
    var wp=rangePlan(rows.map(function(o){return o.d;}));
    var wd=weekData(m),p=ready?payCalc(wd):null,sup=supHours(wd.weeks);
    h+=jobBar()+payHero(p,"S"+isoWeek(m),S.target?wt/(S.target*60):0,"de "+S.target+" h");
    h+=navPill("wk","S"+isoWeek(m)+" · "+shortDate(m)+" – "+shortDate(wEnd));
    var sel=-1;rows.forEach(function(o,i){if(sameDay(o.d,now))sel=i;});
    h+='<section class="panel st-chart"><div class="st-ch-h"><div><span class="st-k">Heures de la semaine</span><b class="st-big" data-cntm="'+wt+'">'+fmt(wt)+'</b></div>'+(wp?'<span class="chip '+(wp.diff>0?"up":wp.diff<0?"down":"eq")+'">'+(wp.diff>0?"+":"")+fmt(wp.diff)+'</span>':'')+'</div>'+
      pillBars(rows.map(function(o,i){return {lbl:L[i],v:o.r.total,txt:fmt(o.r.total),aria:cap(JOURS[o.d.getDay()])+" "+o.d.getDate(),alt:dayAlt(o.d,o.r,o.data),cls:(dayFlag(o.d)?"alert":"")+(sameDay(o.d,now)?" today":"")};}),sel,"week",true)+'</section>';
    h+='<div class="bento">'+
      tile("coral","Heures sup",hh(sup),sup>0?"+35h / sem.":"aucune")+
      (mealsOn()?tile("mint","Repas fournis",String(wRep),"repas"):tile("mint","Jours travaillés",String(wWorked),"cette semaine"))+
      tile("lilac","Moyenne / jour",fmt(wWorked?wt/wWorked:0),wWorked+" jour"+(wWorked>1?"s":"")+" travaillé"+(wWorked>1?"s":""))+
      (wp?tile("lav","Prévu sur "+provName(),fmt(wp.plan),(wp.diff>0?"+":"")+fmt(wp.diff)+" d'écart"):tile("lav","Objectif",S.target+" h",wt>=S.target*60?"atteint":"reste "+fmt(S.target*60-wt)))+
    '</div>';
    h+=extrasPanel(wd,p)+allJobsPanel(function(){var d=weekData(m);return {h:d.total,p:payReady()?payCalc(d):null};},"cette semaine");
    h+='<section class="panel st-days"><h3>Détail des jours</h3><div class="list">'+rows.map(rowHtml).join("")+'</div></section>';
  }

  else if(STV==="month"){
    var y=S.statM.getFullYear(),mo=S.statM.getMonth(),md=monthData(y,mo),pm=new Date(y,mo-1,1),prev=monthData(pm.getFullYear(),pm.getMonth());
    var nDays=new Date(y,mo+1,0).getDate(),mp=rangePlan((function(){var a=[];for(var q=1;q<=nDays;q++)a.push(new Date(y,mo,q));return a;})());
    var mPay=ready?payCalc(md):null,msup=supHours(md.weeks);
    h+=jobBar()+payHero(mPay,MOIS[mo],S.target?md.total/(S.target*60*nDays/7):0,"de l'objectif");
    h+=navPill("mo",cap(MOIS[mo])+" "+y);
    /* calendrier coloré */
    var first=new Date(y,mo,1),last=new Date(y,mo,nDays),g='<div class="cal-h">'+["L","M","M","J","V","S","D"].map(function(l){return '<span>'+l+'</span>';}).join("")+'</div>';
    for(var w=monday(first);w<=last;w=addDays(w,7)){var wsum=0;g+='<div class="cal-r">';
      for(var j=0;j<7;j++){var dd=addDays(w,j),inM=dd.getMonth()===mo;if(!inM){g+='<span class="cal-c out"></span>';continue;}
        var rr=dayCalc(dayOf(dd)),k2=key(dd),c="";wsum+=rr.total;
        if(rr.conge)c="cp";else if(rr.abs&&rr.abs!=="ecole"&&rr.abs!=="formation")c="ab";else if(rr.mode==="repos"&&dayOf(dd))c="off";else if(rr.worked)c=dayFlag(dd)?"alert":rr.total>=480?"h3":rr.total>=300?"h2":"h1";else if(planShifts(k2).length&&k2>key(now))c="plan";
        g+='<button class="cal-c '+c+(ferName(dd)?" fer":"")+(sameDay(dd,now)?" today":"")+'" style="--i:'+dd.getDate()+'" data-goday="'+k2+'" aria-label="'+cap(JOURS[dd.getDay()])+' '+dd.getDate()+(rr.worked?" : "+fmt(rr.total):"")+'">'+(c==="off"?'<i>×</i>':dd.getDate())+'</button>';}
      g+='</div>';}
    var diffPct=prev.total?((md.total-prev.total)/prev.total*100):NaN;
    h+='<section class="panel st-cal"><div class="st-ch-h"><div><span class="st-k">Effectué en '+MOIS[mo]+'</span><b class="st-big" data-cntm="'+md.total+'">'+fmt(md.total)+'</b></div>'+(prev.total?'<div class="st-cmp">'+chip(diffPct,"%")+'</div>':'')+'</div>'+
      '<div class="cal">'+g+'</div>'+
      '<div class="cal-leg"><span><i class="h3"></i>Travaillé</span><span><i class="alert"></i>Alerte</span><span><i class="cp"></i>Congé</span><span><i class="ab"></i>Absence</span><span><i class="plan"></i>Prévu</span><span><i class="fer"></i>Férié</span></div></section>';
    h+='<div class="bento">'+
      tile("lav","Jours travaillés",String(md.worked),md.congeDays?md.congeDays+" jour"+(md.congeDays>1?"s":"")+" de congé":"ce mois-ci")+
      tile("coral","Heures sup",hh(msup),"+35h / sem.")+
      (mealsOn()?tile("mint","Repas fournis",String(md.repas),mPay&&mPay.an?eur2(mPay.an)+" d'avantage":""):tile("mint","Moyenne / jour",fmt(md.worked?md.total/md.worked:0),"sur le mois"))+
      (mp?tile("lilac","Prévu sur "+provName(),fmt(mp.plan),(mp.diff>0?"+":"")+fmt(mp.diff)+" d'écart"):tile("lilac","Meilleure journée",fmt(md.best),""))+
    '</div>';
    h+=extrasPanel(md,mPay)+allJobsPanel(function(){var d=monthData(y,mo);return {h:d.total,p:payReady()?payCalc(d):null};},"en "+MOIS[mo]);
    h+=congesCard();
  }

  else{
    var yy=S.statY,items=[],tot={h:0,s:0},pays=[];
    for(var k=0;k<12;k++){var d2=monthData(yy,k),sp=supHours(d2.weeks),p2=ready&&(d2.total||d2.congeDays||d2.ferChome||d2.absPaidH)?payCalc(d2):null;tot.h+=d2.total;tot.s+=sp;pays.push(p2);

      pillBars(items,ysel,"year")+
      '<div class="st-sel"><b>'+cap(MOIS[ysel])+'</b><span>'+fmt(sm.total)+'</span><span>'+hh(supHours(sm.weeks))+' sup</span>'+(spay?'<span>'+eur(spay.net)+' net</span>':'')+'</div></section>';
    h+='<div class="bento">'+
      tile("coral","Heures sup",hh(tot.s),"sur l'année")+
      tile("lav","Moyenne / mois",fmt(done?tot.h/done:0),done+" mois")+
      (yp?tile("mint","Brut",eur(yp.brut),"cumulé")+tile("lilac","Net",eur(yp.net),"cumulé"):"")+
    '</div>';
    h+=congesCard();
  }
  view.innerHTML='<div class="stv'+(ST_ANIM?" anim":"")+'">'+h+'</div>';
  if(ST_ANIM)statNums();ST_ANIM=false;

/* les grands chiffres montent jusqu'à leur valeur */
function statNums(){if(!window.requestAnimationFrame||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))return;
  [].forEach.call(view.querySelectorAll("[data-cntm],[data-cnte]"),function(el){var m="cntm" in el.dataset,to=+(m?el.dataset.cntm:el.dataset.cnte);if(!to)return;

    el.textContent=m?fmt(0):eur(0);requestAnimationFrame(step);});}
