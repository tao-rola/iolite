  if(ds.jobdel){if(JOBDEL!==ds.jobdel){JOBDEL=ds.jobdel;renderParams();return;}var did=ds.jobdel;JOBDEL=null;if(did==="main")return;
    if(JOB===did){stash();unstash("main");lsSet("pt-job","main");}
    JOBS=JOBS.filter(function(j){return j.id!==did;});delete JCFG[did];delete JDAYS[did];delete JPLAN[did];saveSettings();saveDays();savePlan();render();return;}
  if("schoolday" in ds){var sk=key(S.cur);S.days[sk]={mode:"abs",abs:"ecole",h:Math.round(planTotal(sk))};saveDays();renderShift();return;}
  if(ds.day){var p=ds.day.split("-");S.cur=new Date(+p[0],+p[1]-1,+p[2]);W=null;render();return;}
  if("combosync" in ds){syncCombo(true);return;}
  if(ds.prov){S.combo.prov=ds.prov;savePlanLocal();renderParams();return;}
  if("combooff" in ds){S.combo={url:null,last:null,err:null,count:0};savePlan();renderParams();return;}
  if(ds.sv){ST_ANIM=true;STV=ds.sv;try{localStorage.setItem("pt-statv",STV);}catch(e){}renderStats();return;}
  if(ds.bar){var bp=ds.bar.split(":");STSEL[bp[0]]=+bp[1];keepScroll(function(){});return;}
  if(ds.goday){var gp=ds.goday.split("-");S.cur=new Date(+gp[0],+gp[1]-1,+gp[2]);goTab("shift");return;}
  if(ds.wk){ST_ANIM=true;STSEL.week=null;keepScroll(function(){S.statW=addDays(S.statW,7*(+ds.wk));});return;}
  if(ds.mo){ST_ANIM=true;keepScroll(function(){S.statM=new Date(S.statM.getFullYear(),S.statM.getMonth()+(+ds.mo),1);});return;}
  if(ds.yr){ST_ANIM=true;STSEL.year=null;keepScroll(function(){S.statY+=(+ds.yr);});return;}
  if(ds.target){S.target=Math.max(1,Math.min(60,S.target+(+ds.target)));updateEq();saveSettings();var o=document.getElementById("tgt");if(o)o.textContent=S.target+" h";return;}
  if(ds.maj){S.pay.maj=ds.maj;updateEq();saveSettings();renderParams();return;}
  if("spliton" in ds){S.pay.split=!splitOn();saveSettings();renderParams();return;}
  if("mealson" in ds){S.pay.mealsOn=!mealsOn();saveSettings();renderParams();return;}
  if("recap" in ds){S.reminder.recap=S.reminder.recap===false;saveSettings();mirror();renderParams();updateBadge();return;}
  if("remadd" in ds){var ts=S.reminder.times;ts.push(ts.length?"21:00":"22:00");saveSettings();if(OB)renderOnboarding();else renderParams();return;}
  if(ds.remdel){S.reminder.times.splice(+ds.remdel,1);saveSettings();if(OB)renderOnboarding();else renderParams();checkReminder();return;}
  if("export" in ds){exportData();return;}
});
function bkMsg(t){var m=document.getElementById("bk-msg");if(m)m.textContent=t;}
function exportData(){
  var data={app:"iolite",version:4,exportedAt:new Date().toISOString(),days:allDaysMap(),settings:settingsObj(),plan:allPlanData(),combo:{url:mainCombo().url}};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="iolite-"+key(new Date())+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},2000);bkMsg("Sauvegarde téléchargée.");
}
view.addEventListener("submit",function(e){if(e.target.id==="auth-form"){e.preventDefault();authSubmit();}});
view.addEventListener("keydown",function(e){if(e.key==="Enter"&&OB&&e.target.tagName==="INPUT"){e.preventDefault();var b=view.querySelector('[data-ob="next"]');if(b)b.click();return;}if(e.key==="Enter"&&W&&e.target.tagName==="INPUT"){e.preventDefault();var b=view.querySelector('[data-wiz="next"]');if(b)b.click();}});
view.addEventListener("change",function(e){var i=e.target;
  if("phone" in i.dataset){var tel=normPhone(i.value),pm=document.getElementById("pf-msg");if(!tel){if(pm)pm.textContent="Ce numéro n'est pas valide : il reste "+(PROFILE.phone?showPhone(PROFILE.phone):"vide")+".";return;}
    PROFILE.phone=tel;i.value=showPhone(tel);PHONE_TAKEN=false;if(pm)pm.textContent="";pushProfile();return;}
  if(!OB&&SUB==="jobs"&&i.dataset.jobname!=null){renderParams();return;}
  if(!OB&&SUB==="contrat"&&("cpstart" in i.dataset||"cend" in i.dataset||"cen" in i.dataset||"crn" in i.dataset)){var y=window.scrollY;renderParams();window.scrollTo(0,y);return;}
  if(i.id==="av-file"){setAvatar(i.files&&i.files[0]);i.value="";return;}
  if(i.id==="combo-url"){S.combo.url=i.value.trim()||null;S.combo.last=null;S.combo.err=null;var pd=provOf(S.combo.url);if(pd)S.combo.prov=pd.id;savePlan();syncCombo(true);return;}
  if(i.id==="ics-file"&&i.files&&i.files[0]){var fr=new FileReader();fr.onload=function(){try{mergePlan(parseICS(fr.result));renderParams();}catch(x){comboMsg("Ce fichier n'est pas un calendrier .ics.");}};fr.readAsText(i.files[0]);i.value="";return;}
  if(i.dataset.remidx){if(i.value){S.reminder.times[+i.dataset.remidx]=i.value;saveSettings();checkReminder();}return;}
  if(i.id!=="imp-file"||!i.files||!i.files[0])return;
  var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!d||(d.app!=="iolite"&&d.app!=="ma-pointeuse")||typeof d.days!=="object")throw 0;
      setAllDays(d.days||{});applySettings(d.settings);if(d.plan)setAllPlan(d.plan,Object.assign({},mainCombo(),d.combo&&d.combo.url?{url:d.combo.url}:{}));savePlan();saveDays();saveSettings();
      renderParams();var n=Object.keys(S.days).length;bkMsg(n+(n>1?" journées importées.":" journée importée."));}
    catch(x){bkMsg("Ce fichier n'est pas une sauvegarde iolite.");}};
  r.readAsText(i.files[0]);i.value="";});
view.addEventListener("input",function(e){var i=e.target;
  if(i.dataset.pay){var f=i.dataset.pay;S.pay[f]=i.value.trim()===""?null:i.value.trim();
    if(f==="rate")S.pay.mode="horaire";else if(f==="monthly")S.pay.mode="mensuel";
    updateEq(i);saveSettings();return;}
  if(i.dataset.majc){S.pay.majc=S.pay.majc||{};S.pay.majc[i.dataset.majc]=i.value.trim()||null;saveSettings();return;}
  if("cpstart" in i.dataset){S.conges.start=/^\d{4}-\d{2}-\d{2}$/.test(i.value)?i.value:null;saveSettings();return;}
  if("cend" in i.dataset){ct().end=/^\d{4}-\d{2}-\d{2}$/.test(i.value)?i.value:null;saveSettings();return;}
  if("cen" in i.dataset){ct().en=i.value.trim()||null;saveSettings();return;}
  if("crn" in i.dataset){ct().rn=i.value.trim()||null;saveSettings();return;}
  if(i.dataset.ov){S.pay.ov=S.pay.ov||{};var ov=i.value.trim();if(ov==="")delete S.pay.ov[i.dataset.ov];else S.pay.ov[i.dataset.ov]=ov;saveSettings();return;}
  if(i.dataset.jobname){var jj=JOBS.filter(function(j){return j.id===i.dataset.jobname;})[0];if(jj){jj.name=i.value;saveSettings();}return;}
  if("cp" in i.dataset){S.conges.report=i.value.trim()===""?null:i.value.trim();saveSettings();return;}
  if(i.id==="wiz-time"&&i.value){svcObj(i.dataset.wizs)[i.dataset.wizf]=i.value;tidy(key(S.cur));return;}
  if(i.id==="combo-url"){S.combo.url=i.value.trim()||null;savePlan();return;}
  if(i.dataset.prof){if(i.dataset.prof==="last_name"){var cp=i.selectionStart,up=i.value.toUpperCase();if(up!==i.value){i.value=up;try{i.setSelectionRange(cp,cp);}catch(e){}}}
    PROFILE[i.dataset.prof]=i.value;if(!OB)pushProfileSoon();else saveProfileLocal();return;}
});
