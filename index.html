      g+='</div>';}
    var diffPct=prev.total?((md.total-prev.total)/prev.total*100):NaN;
    h+='<section class="panel st-cal"><div class="st-ch-h"><div><span class="st-k">Effectué en '+MOIS[mo]+'</span><b class="st-big" data-cntm="'+md.total+'">'+fmt(md.total)+'</b></div>'+(prev.total?'<div class="st-cmp">'+chip(diffPct,"%")+'</div>':'')+'</div>'+
      '<div class="cal">'+g+'</div>'+
      '<div class="cal-leg"><span><i class="h3"></i>Travaillé</span><span><i class="alert"></i>Alerte</span><span><i class="cp"></i>Congé</span><span><i class="plan"></i>Prévu</span></div></section>';
    h+='<div class="bento">'+
      tile("lav","Jours travaillés",String(md.worked),md.congeDays?md.congeDays+" jour"+(md.congeDays>1?"s":"")+" de congé":"ce mois-ci")+
      tile("coral","Heures sup",hh(msup),"+35h / sem.")+
      tile("mint","Repas fournis",String(md.repas),mPay&&mPay.an?eur2(mPay.an)+" d'avantage":"")+
      (mp?tile("lilac","Prévu sur "+provName(),fmt(mp.plan),(mp.diff>0?"+":"")+fmt(mp.diff)+" d'écart"):tile("lilac","Meilleure journée",fmt(md.best),""))+
    '</div>';
    h+=congesCard();
  }

  else{
    var yy=S.statY,items=[],tot={h:0,s:0},pays=[];
    for(var k=0;k<12;k++){var d2=monthData(yy,k),sp=supHours(d2.weeks),p2=ready&&(d2.total||d2.congeDays)?payCalc(d2):null;tot.h+=d2.total;tot.s+=sp;pays.push(p2);
      items.push({lbl:"JFMAMJJASOND"[k],v:d2.total,txt:fmt(d2.total),aria:MOIS[k],alt:"0h",cls:yy===now.getFullYear()&&k===now.getMonth()?"today":""});}
    var yp=sumPay(pays),done=yy<now.getFullYear()?12:yy>now.getFullYear()?0:now.getMonth()+1;
    h+=payHero(yp,String(yy),S.target&&done?tot.h/(S.target*60*52/12*done):0,"de l'objectif");
    h+=navPill("yr",String(yy));
    var ysel=STSEL.year;if(ysel==null)ysel=yy===now.getFullYear()?now.getMonth():11;
    var sm=monthData(yy,ysel),spay=pays[ysel];
    h+='<section class="panel st-chart"><div class="st-ch-h"><div><span class="st-k">Heures en '+yy+'</span><b class="st-big" data-cntm="'+tot.h+'">'+fmt(tot.h)+'</b></div></div>'+
      pillBars(items,ysel,"year")+
      '<div class="st-sel"><b>'+cap(MOIS[ysel])+'</b><span>'+fmt(sm.total)+'</span><span>'+hh(supHours(sm.weeks))+' sup</span>'+(spay?'<span>'+eur(spay.net)+' net</span>':'')+'</div></section>';
    h+='<div class="bento">'+
      tile("coral","Heures sup",hh(tot.s),"sur l'année")+
      tile("lav","Moyenne / mois",fmt(done?tot.h/done:0),done+" mois")+
      (yp?tile("mint","Brut",eur(yp.brut),"cumulé")+tile("lilac","Net",eur(yp.net),"cumulé"):"")+
    '</div>';
    h+=congesCard();
  }
  view.innerHTML='<div class="stv'+(ST_ANIM?" anim":"")+'">'+h+'</div>';
  if(ST_ANIM)statNums();ST_ANIM=false;
}
/* les grands chiffres montent jusqu'à leur valeur */
function statNums(){if(!window.requestAnimationFrame||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))return;
  [].forEach.call(view.querySelectorAll("[data-cntm],[data-cnte]"),function(el){var m="cntm" in el.dataset,to=+(m?el.dataset.cntm:el.dataset.cnte);if(!to)return;
    var t0=null,dur=800;function step(t){if(t0==null)t0=t;var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=m?fmt(to*e):eur(to*e);if(p<1)requestAnimationFrame(step);}
    el.textContent=m?fmt(0):eur(0);requestAnimationFrame(step);});}
function svcSub(v){return svcCalc(v)?v.start+" / "+v.end:"";}
function rowHtml(o){var mx=720,r=o.r,d=o.data,act=active(d);

  var pdf=planDiff(o.d);if(pdf)sub+=(sub?" · ":"")+"prévu "+fmt(planTotal(key(o.d)));
  var bars='<span class="bline">'+act.map(function(s){return r[s]?'<span class="bar '+CLS[s]+'" style="width:'+Math.min(40,r[s]/mx*55)+'%"></span>'+(d[s].repas===true?'<span class="meal '+CLS[s]+'">repas</span>':''):'';}).join("")+'</span>';
  return '<div class="li"><span class="d">'+JOURS[o.d.getDay()].slice(0,3)+'.<small>'+shortDate(o.d)+'</small></span>'+
    '<span class="bars-row"><span class="bars">'+(r.worked?bars:'')+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</span></span>'+
    '<span class="t'+(r.worked?"":" off")+(dayFlag(o.d)?" warn":"")+'">'+fmt(r.total)+'</span></div>';}

function message(a){var v='<b>'+a.val+'</b>';
  switch(a.kind){
    case "rest":return "Seulement "+v+" de repos avant cette journée. Le minimum légal est de 11 h.";
    case "long":return "Vous avez travaillé "+v+" ce jour-là, au-delà des 10 h maximum par jour.";
    case "amp":return "Votre journée s'est étalée sur "+v+" du premier au dernier service. L'amplitude maximale est de 13 h.";
    case "run":return "C'est votre "+a.val+"ᵉ jour de travail d'affilée. Pensez à prendre votre repos hebdomadaire.";
    case "week":return "Vous avez fait "+v+" cette semaine, au-delà des 48 h maximum.";
    case "today":return "Vous n'avez encore rien pointé aujourd'hui.";
    case "over":return "Vous avez travaillé "+v+" de plus que prévu sur votre planning "+provName()+".";
    case "recap":return a.text;}
  return a.label;}
/* ---------- résumé de la semaine : le dimanche à partir de 20 h ---------- */
var RECAP_H=20;
function recapReady(m){var sun=addDays(m,6),t=new Date();if(key(sun)<key(t))return true;return key(sun)===key(t)&&t.getHours()>=RECAP_H;}
function recapText(m){var wt=weekTotal(m),days=0,rep=0;for(var i=0;i<7;i++){var r=dayCalc(dayOf(addDays(m,i)));if(r.worked)days++;rep+=r.repas;}
  var sup=Math.max(0,wt/60-35),pl=rangePlan([0,1,2,3,4,5,6].map(function(i){return addDays(m,i);}));
  var t="Résumé de la semaine "+isoWeek(m)+" : <b>"+fmt(wt)+"</b> sur "+days+" jour"+(days>1?"s":"")+(sup>0?", dont <b>"+hh(sup)+"</b> d'heures sup":"")+".";
  if(pl&&Math.abs(pl.diff)>=15)t+=" C'est "+(pl.diff>0?"<b>"+fmt(pl.diff)+"</b> de plus":"<b>"+fmt(-pl.diff)+"</b> de moins")+" que prévu sur "+provName()+".";
  if(rep)t+=" "+rep+" repas fourni"+(rep>1?"s":"")+".";
  if(payReady()){var md={weeks:[wt],repas:rep,congeH:0};var p=payCalc(md);t+=" Environ <b>"+eur(p.net)+"</b> net.";}
  return t;}
function recapOf(m){if(!recapReady(m)||!weekTotal(m)||addDays(m,6)<addDays(new Date(),-28))return null;var sun=addDays(m,6);return {dt:sun,kind:"recap",text:recapText(m),id:"recap:"+key(m),late:true};}
/* toutes les alertes, dans l'ordre chronologique, chacune avec un identifiant stable */
function allMessages(){var msgs=[];
  weeksWithData().slice().reverse().forEach(function(m){
    weekAlerts(m).forEach(function(a){
      if(a.dt)a.id=a.kind+":"+key(a.dt);
      else{var end=addDays(m,6);a.dt=end>new Date()?new Date():end;a.id="week:"+key(m);}
      msgs.push(a);});});
  if(S.reminder.recap!==false)weeksWithData().forEach(function(m){var r=recapOf(m);if(r)msgs.push(r);});
  if(reminderDue()){var t=new Date();msgs.push({dt:t,kind:"today",val:"",id:"today:"+key(t)});}
  msgs.sort(function(x,y){return key(x.dt)<key(y.dt)?-1:key(x.dt)>key(y.dt)?1:((x.kind==="week")+(x.late?2:0))-((y.kind==="week")+(y.late?2:0));});
  return msgs;}
/* alertes déjà lues (mémorisées dans ce navigateur) */
function getSeen(){try{return JSON.parse(localStorage.getItem("pt-seen")||"{}")||{};}catch(e){return {};}}
function markSeen(msgs){var seen=getSeen(),ch=false;msgs.forEach(function(a){if(!seen[a.id]){seen[a.id]=1;ch=true;}});try{localStorage.setItem("pt-seen",JSON.stringify(seen));}catch(e){}if(ch)pushProfileSoon();}
var ALERT_JUMP=true; /* vrai quand on arrive sur la page Alertes */
function renderAlerts(){
  var msgs=allMessages(),seen=getSeen(),h='<div class="chat">',prevDay=null,open=false,newShown=false;
  function close(){if(open){h+='</div></div>';open=false;}}
  function openGrp(){h+='<div class="grp">'+BOT+'<div class="bubbles">';open=true;}
  if(!msgs.length)h+='<div class="grp">'+BOT+'<div class="bubbles"><p class="bubble">Aucune alerte pour le moment. Je vous écrirai ici si un repos est trop court ou si une journée dépasse les limites.</p></div></div>';
  msgs.forEach(function(a){var k=key(a.dt),isNew=!seen[a.id];
    if(isNew&&!newShown){close();h+='<div class="new-sep" id="new-sep"><span>Nouveaux messages</span></div>';newShown=true;}
    if(k!==prevDay){close();
      var today=sameDay(a.dt,new Date()),yest=sameDay(a.dt,addDays(new Date(),-1));
      h+='<div class="day-sep"><span>'+(today?"Aujourd'hui":yest?"Hier":cap(JOURS[a.dt.getDay()])+" "+a.dt.getDate()+" "+MOIS[a.dt.getMonth()])+'</span></div>';prevDay=k;}
    var first=!open;if(!open)openGrp();
    h+='<p class="bubble'+(isNew?" new":"")+'">'+(first?greet(message(a)):message(a))+'</p>';});
  close();h+='</div>';
  view.innerHTML=h;
  var sep=document.getElementById("new-sep");
  /* à l'ouverture de la page : on arrive en bas, sur la dernière alerte (seulement si la page dépasse l'écran, sinon iOS décale l'affichage) */
  if(ALERT_JUMP){ALERT_JUMP=false;requestAnimationFrame(function(){var room=document.documentElement.scrollHeight-window.innerHeight;window.scrollTo(0,room>4?room:0);});}
  markSeen(msgs);updateBadge();
}

  h+=group("Planning",[row({icon:"cal",t:"Logiciel de planning",v:S.combo.url?provSel().n:"Non relié",attr:'data-sub="combo"'})]);
  h+=group("Données",[
    row({icon:"down",t:"Exporter mes données",chev:false,attr:'data-export'}),
    row({icon:"up",t:"Importer une sauvegarde",chev:false,label:"imp-file"}),
    row({icon:"reload",t:"Mettre à jour l'application",sub:"Télécharge la dernière version, sans rien effacer",chev:false,attr:'data-hardreload'})],
    '<input type="file" id="imp-file" accept="application/json,.json" hidden><p class="snote" id="bk-msg"></p>');
  if(mail)h+=group("Compte",[
    row({icon:"out",t:"Se déconnecter",chev:false,cls:"accent",attr:'data-logout'}),
    row({icon:"trash",t:"Supprimer mon compte",cls:"danger",attr:'data-sub="del"'})]);
  h+='<p class="snote ver">IOLITE · VERSION 0.34</p></div>';
  view.innerHTML=h;
}
function renderSub(){
  var P=S.pay,R=S.reminder,mail=USER&&USER.email?USER.email:"",k=SUB,t="",b="";
  if(k==="profil"){t="Profil";
    b='<div class="av-edit">'+avatarHtml("big")+'<div class="av-acts"><label class="av-btn" for="av-file">'+(PROFILE.avatar?"Changer la photo":"Ajouter une photo")+'</label>'+
      (PROFILE.avatar?'<button class="av-btn del" data-avdel>Retirer</button>':'')+'</div><input type="file" id="av-file" accept="image/*" hidden><p class="snote" id="av-msg"></p></div>'+
      '<div class="set">'+
      '<div class="field"><label for="pf-first">Prénom</label><input id="pf-first" data-prof="first_name" autocomplete="given-name" value="'+esc(PROFILE.first_name)+'"></div>'+
      '<div class="field"><label for="pf-last">Nom</label><input id="pf-last" data-prof="last_name" autocomplete="family-name" value="'+esc(PROFILE.last_name)+'"></div></div>';
    if(mail){b+=group("Connexion",[
        row({icon:"mail",t:"E-mail",v:esc(mail),cls:ACC==="mail"?"open":"",attr:'data-acc="'+(ACC==="mail"?"":"mail")+'"'}),
        row({icon:"key",t:"Mot de passe",v:"••••••••",cls:ACC==="pw"?"open":"",attr:'data-acc="'+(ACC==="pw"?"":"pw")+'"'})]);
      if(ACC==="pw"||ACC==="mail")b+='<div class="set">'+accForm(ACC)+'</div>';
      if(ACCMSG)b+='<p class="snote acc-ok">'+esc(ACCMSG)+'</p>';}}
  else if(k==="pay"){t="Heures et salaire";
    b='<div class="set">'+
      '<div class="set-row"><span class="t">Heures par semaine</span><div class="stepper"><button data-target="-1" aria-label="Une heure de moins">−</button><output id="tgt">'+S.target+' h</output><button data-target="1" aria-label="Une heure de plus">+</button></div></div>'+
      '<div class="field money"><label for="pay-rate">À l\'heure (brut)</label><input id="pay-rate" data-pay="rate" inputmode="decimal" autocomplete="off" placeholder="12,50"><em>€</em></div>'+
      '<div class="field money"><label for="pay-monthly">Au mois (brut)</label><input id="pay-monthly" data-pay="monthly" inputmode="decimal" autocomplete="off" placeholder="1 900"><em>€</em></div>'+
      '<div class="field money"><label for="pay-charges">Cotisations salariales (brut → net)</label><input id="pay-charges" data-pay="charges" inputmode="decimal" autocomplete="off" value="'+esc(P.charges==null?"":P.charges)+'"><em>%</em></div>'+
      '</div><p class="snote">Remplissez le taux horaire ou le salaire mensuel : l\'autre se calcule tout seul.</p>';}
  else if(k==="maj"){t="Heures sup";
    var opts=[["legal","Code du travail","+25 % de la 36ᵉ à la 43ᵉ heure, +50 % au-delà"],["hcr","Convention HCR","+10 % de la 36ᵉ à la 39ᵉ, +20 % de la 40ᵉ à la 43ᵉ, +50 % au-delà"],["none","Aucune majoration","Les heures sup sont payées au taux normal"]];
    b='<section class="sgrp"><h2>Majoration</h2><div class="maj-list">'+opts.map(function(o){return '<button class="maj" data-maj="'+o[0]+'" aria-pressed="'+(P.maj===o[0])+'"><span class="radio"></span><span><b>'+o[1]+'</b><small>'+o[2]+'</small></span></button>';}).join("")+'</div></section>';}
  else if(k==="meal"){t="Repas fournis";
    b='<div class="set"><div class="field money"><label for="pay-meal">Valeur d\'un repas fourni</label><input id="pay-meal" data-pay="meal" inputmode="decimal" autocomplete="off" placeholder="ex. 4,35" value="'+esc(P.meal==null?"":P.meal)+'"><em>€</em></div></div>'+
      '<p class="snote">Comme sur la fiche de paie : ajoutée au brut pour chaque repas pris au travail, puis retirée du net. En hôtellerie-restauration, elle vaut 4,35 € depuis le 1er juin 2026.</p>';}
  else if(k==="conges"){t="Congés payés";
    b='<div class="set"><div class="field"><label for="cp-start">Début du contrat</label><input id="cp-start" class="txt" type="date" data-cpstart value="'+esc(S.conges.start||"")+'"></div>'+
      '</div>'+
      '<p class="snote">Tout est calculé à partir de cette date : 2,5 jours acquis par mois travaillé (le premier mois au prorata), puis décomptés à chaque congé pointé.</p>';}
  else if(k==="rem"){t="Rappels";var times=R.times||[];
    b='<div class="set"><div class="rem-list">'+times.map(function(x,n){return '<div class="rem-row"><input type="time" id="rem-'+n+'" data-remidx="'+n+'" value="'+esc(x)+'" aria-label="Horaire de rappel '+(n+1)+'">'+
      (times.length>1?'<button class="rem-del" data-remdel="'+n+'" aria-label="Supprimer cet horaire">×</button>':'')+'</div>';}).join("")+'</div>'+
      (times.length<5?'<button class="rem-add" data-remadd>Ajouter un horaire</button>':'')+'</div>'+
      '<p class="snote">Si rien n\'est pointé, iolite vous envoie une notification à ces horaires.'+(permNote()?' '+permNote():'')+'</p>';}
  else if(k==="combo"){t="Planning";var pv=provSel();
    b='<section class="sgrp"><h2>Logiciel</h2><div class="prov-list">'+PROVS.map(function(p){return '<button class="prov'+(p.id===pv.id?" on":"")+'" data-prov="'+p.id+'" aria-pressed="'+(p.id===pv.id)+'">'+p.n+'</button>';}).join("")+'</div></section>'+
      '<section class="sgrp"><h2>Adresse</h2><div class="set"><div class="field"><label for="combo-url">Adresse de synchronisation '+esc(pv.n)+'</label><input id="combo-url" class="txt" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Collez l\'adresse donnée par '+esc(pv.n)+'" value="'+esc(S.combo.url||"")+'"></div>'+
      (S.combo.url?'<div class="backup"><button data-combosync>Synchroniser maintenant</button></div>':'')+'</div>'+
      '<p class="snote" id="combo-msg">'+esc(comboStatus()||pv.help)+'</p></section>'+
      (S.combo.url?group("",[row({t:"Déconnecter "+pv.n,chev:false,cls:"danger",attr:'data-combooff'})]):'');}
  else if(k==="del"){t="Supprimer mon compte";b='<div class="set">'+accForm("del")+'</div>';}
  setHead(t,"");
  view.innerHTML='<div class="sett sub"><button class="sback" data-sub="">'+ICON_L+'<span>Réglages</span></button>'+b+'</div>';
  if(k==="pay")updateEq();
}
/* ---------- compte : mot de passe, e-mail, suppression ---------- */
var ACC=null,ACCMSG="";
function accHtml(){return (ACC==="pw"||ACC==="mail"?accForm(ACC):"")+(ACCMSG&&ACC!=="del"?'<p class="note acc-ok">'+esc(ACCMSG)+'</p>':"");}
function accForm(k){var cur='<div class="field"><label for="acc-cur">Mot de passe actuel</label><input id="acc-cur" type="password" autocomplete="current-password"></div>';
  var h='<div class="acc-form">';
  if(k==="pw")h+=cur+'<div class="field"><label for="acc-new">Nouveau mot de passe</label><input id="acc-new" type="password" autocomplete="new-password" placeholder="6 caractères minimum"></div>';
  else if(k==="mail")h+='<div class="field"><label for="acc-mail">Nouvelle adresse e-mail</label><input id="acc-mail" class="txt" type="email" inputmode="email" autocomplete="email" spellcheck="false"></div>'+cur;
  else h+='<p class="note">Votre compte et toutes vos données (journées pointées, réglages, planning) seront effacés définitivement. Pensez à exporter vos données avant si vous voulez les garder.</p>'+cur;
  h+='<p class="note acc-err" id="acc-msg"></p><div class="backup"><button class="'+(k==="del"?"danger-btn":"")+'" data-accgo="'+k+'">'+(k==="del"?"Supprimer définitivement":"Enregistrer")+'</button><button class="imp" '+(k==="del"?'data-sub=""':'data-acc=""')+'>Annuler</button></div></div>';
  return h;}
function accGo(k){var msg=document.getElementById("acc-msg"),btn=view.querySelector("[data-accgo]"),cur=(document.getElementById("acc-cur")||{}).value||"";
  function say(t){msg.textContent=t;btn.disabled=false;}
  function done(t){ACC=null;ACCMSG=t;renderParams();}
  if(!SB||!USER)return say("Connexion impossible pour le moment.");
  if(!cur)return say("Indiquez votre mot de passe actuel.");
  var nw=(document.getElementById("acc-new")||{}).value||"",nm=((document.getElementById("acc-mail")||{}).value||"").trim();
  if(k==="pw"&&nw.length<6)return say("Le nouveau mot de passe doit faire au moins 6 caractères.");
  if(k==="mail"&&!/^\S+@\S+\.\S+$/.test(nm))return say("Indiquez une adresse e-mail valide.");
  if(k==="mail"&&nm.toLowerCase()===(USER.email||"").toLowerCase())return say("C'est déjà votre adresse actuelle.");
  btn.disabled=true;msg.textContent="";
  SB.auth.signInWithPassword({email:USER.email,password:cur}).then(function(r){
    if(r.error)throw {iolite:/invalid login/i.test(r.error.message||"")?"Mot de passe actuel incorrect.":authErr(r.error)};
    if(k==="pw")return SB.auth.updateUser({password:nw}).then(function(x){if(x.error)throw x.error;done("Mot de passe modifié.");});
    if(k==="mail")return SB.auth.updateUser({email:nm},{emailRedirectTo:location.origin+location.pathname}).then(function(x){if(x.error)throw x.error;
      done("Un lien de confirmation a été envoyé. La nouvelle adresse sera active une fois le lien ouvert (Supabase peut aussi demander de confirmer depuis l'ancienne).");});
    return SB.rpc("delete_my_account").then(function(x){if(x.error){if(/function|schema cache|not find/i.test(x.error.message||""))throw {iolite:"La suppression n'est pas encore activée sur le serveur. Réessayez plus tard."};throw x.error;}
      var fin=function(){SUB=null;resetLocal();lsSet("pt-owner",null);USER=null;cloudReady=false;W=null;ACC=null;ACCMSG="";showAuth("login","Votre compte et toutes vos données ont été supprimés.");};
      SB.auth.signOut({scope:"local"}).then(fin,fin);});
  }).catch(function(e){say(e&&e.iolite?e.iolite:authErr(e));});}
function dec2(n){return n==null||!isFinite(n)?"":n.toFixed(2).replace(".",",");}
/* les deux champs se remplissent l'un l'autre : celui saisi en dernier fait foi */
function updateEq(skip){
  var P=S.pay,men=P.mode==="mensuel",ok=payReady();
  if(men)P.rate=ok?dec2(hourly()):null;else P.monthly=ok?dec2(baseBrut()):null;
  var ri=document.getElementById("pay-rate"),mi=document.getElementById("pay-monthly");
  if(ri&&ri!==skip)ri.value=P.rate==null?"":P.rate;
  if(mi&&mi!==skip)mi.value=P.monthly==null?"":P.monthly;
}

/* ---------- interactions ---------- */
document.getElementById("prev").onclick=function(){S.cur=addDays(S.cur,-1);W=null;render();};
document.getElementById("next").onclick=function(){S.cur=addDays(S.cur,1);W=null;render();};
function goTab(t){SUB=null;if(t==="stats")ST_ANIM=true;if(t==="alerts")ALERT_JUMP=true;if(t!=="shift"||S.tab!=="shift")W=null;S.tab=t;try{localStorage.setItem("pt-tab",t);}catch(e){}render();if(t!=="alerts")window.scrollTo(0,0);}
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){goTab(b.dataset.tab);};});
function keepScroll(fn){var y=window.scrollY;fn();render();window.scrollTo(0,y);}

/* un appui sur la carte du salaire déplie ou replie le détail */
function togglePay(sec){var on=sec.getAttribute("aria-expanded")!=="true";sec.setAttribute("aria-expanded",String(on));
  var pf=sec.querySelector(".pay-fold");if(pf)pf.classList.toggle("open",on);try{localStorage.setItem("pt-paydet",on?"1":"0");}catch(e){}}
document.addEventListener("click",function(e){var pp=e.target.closest("[data-paypanel]");if(pp){togglePay(pp);}});
document.addEventListener("keydown",function(e){var pp=e.target.closest&&e.target.closest("[data-paypanel]");if(pp&&(e.key==="Enter"||e.key===" ")){e.preventDefault();togglePay(pp);}});
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;var ds=t.dataset;
  if("goToday" in ds){S.cur=new Date();W=null;render();return;}
  if(obClick(ds))return;
  if(ds.auth){showAuth(ds.auth);return;}
  if("retry" in ds){var u=USER;USER=null;startUser(u);return;}
  if("logout" in ds){signOut();return;}
  if(ds.sub!=null){openSub(ds.sub||null);return;}
  if("avdel" in ds){PROFILE.avatar="";saveProfileLocal();saveSettings();renderParams();return;}
  if(ds.acc!=null){ACC=ds.acc||null;ACCMSG="";renderParams();var f=document.getElementById(ACC==="mail"?"acc-mail":ACC?"acc-cur":"");if(f)f.focus();return;}
  if(ds.accgo){accGo(ds.accgo);return;}
  if("hardreload" in ds){hardReload(ds);return;}
  if(wizClick(ds))return;
  if(ds.day){var p=ds.day.split("-");S.cur=new Date(+p[0],+p[1]-1,+p[2]);W=null;render();return;}
  if("combosync" in ds){syncCombo(true);return;}
  if(ds.prov){S.combo.prov=ds.prov;savePlanLocal();renderParams();return;}
  if("combooff" in ds){S.combo={url:null,last:null,err:null,count:0};savePlan();renderParams();return;}
  if(ds.sv){ST_ANIM=true;STV=ds.sv;try{localStorage.setItem("pt-statv",STV);}catch(e){}renderStats();return;}
  if(ds.bar){var bp=ds.bar.split(":");STSEL[bp[0]]=+bp[1];keepScroll(function(){});return;}
  if(ds.goday){var gp=ds.goday.split("-");S.cur=new Date(+gp[0],+gp[1]-1,+gp[2]);goTab("shift");return;}
  if(ds.wk){ST_ANIM=true;STSEL.week=null;keepScroll(function(){S.statW=addDays(S.statW,7*(+ds.wk));});return;}
  if(ds.mo){ST_ANIM=true;keepScroll(function(){S.statM=new Date(S.statM.getFullYear(),S.statM.getMonth()+(+ds.mo),1);});return;}
  if(ds.yr){ST_ANIM=true;STSEL.year=null;keepScroll(function(){S.statY+=(+ds.yr);});return;}
  if(ds.target){S.target=Math.max(1,Math.min(60,S.target+(+ds.target)));updateEq();saveSettings();var o=document.getElementById("tgt");if(o)o.textContent=S.target+" h";return;}
  if(ds.maj){S.pay.maj=ds.maj;updateEq();saveSettings();renderParams();return;}
  if("recap" in ds){S.reminder.recap=S.reminder.recap===false;saveSettings();mirror();renderParams();updateBadge();return;}
  if("remadd" in ds){var ts=S.reminder.times;ts.push(ts.length?"21:00":"22:00");saveSettings();if(OB)renderOnboarding();else renderParams();return;}
  if(ds.remdel){S.reminder.times.splice(+ds.remdel,1);saveSettings();if(OB)renderOnboarding();else renderParams();checkReminder();return;}
  if("export" in ds){exportData();return;}
});
function bkMsg(t){var m=document.getElementById("bk-msg");if(m)m.textContent=t;}
function exportData(){
  var data={app:"iolite",version:3,exportedAt:new Date().toISOString(),days:S.days,settings:settingsObj(),plan:S.plan,combo:{url:S.combo.url}};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="iolite-"+key(new Date())+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},2000);bkMsg("Sauvegarde téléchargée.");
}
view.addEventListener("submit",function(e){if(e.target.id==="auth-form"){e.preventDefault();authSubmit();}});
view.addEventListener("keydown",function(e){if(e.key==="Enter"&&OB&&e.target.tagName==="INPUT"){e.preventDefault();var b=view.querySelector('[data-ob="next"]');if(b)b.click();return;}if(e.key==="Enter"&&W&&e.target.tagName==="INPUT"){e.preventDefault();var b=view.querySelector('[data-wiz="next"]');if(b)b.click();}});
view.addEventListener("change",function(e){var i=e.target;
  if(i.id==="av-file"){setAvatar(i.files&&i.files[0]);i.value="";return;}
  if(i.id==="combo-url"){S.combo.url=i.value.trim()||null;S.combo.last=null;S.combo.err=null;var pd=provOf(S.combo.url);if(pd)S.combo.prov=pd.id;savePlan();syncCombo(true);return;}
  if(i.id==="ics-file"&&i.files&&i.files[0]){var fr=new FileReader();fr.onload=function(){try{mergePlan(parseICS(fr.result));renderParams();}catch(x){comboMsg("Ce fichier n'est pas un calendrier .ics.");}};fr.readAsText(i.files[0]);i.value="";return;}
  if(i.dataset.remidx){if(i.value){S.reminder.times[+i.dataset.remidx]=i.value;saveSettings();checkReminder();}return;}
  if(i.id!=="imp-file"||!i.files||!i.files[0])return;
  var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!d||(d.app!=="iolite"&&d.app!=="ma-pointeuse")||typeof d.days!=="object")throw 0;
      S.days=d.days||{};applySettings(d.settings);if(d.plan)S.plan=d.plan;if(d.combo&&d.combo.url)S.combo.url=d.combo.url;savePlan();saveDays();saveSettings();
      renderParams();var n=Object.keys(S.days).length;bkMsg(n+(n>1?" journées importées.":" journée importée."));}
    catch(x){bkMsg("Ce fichier n'est pas une sauvegarde iolite.");}};
  r.readAsText(i.files[0]);i.value="";});
view.addEventListener("input",function(e){var i=e.target;
  if(i.dataset.pay){var f=i.dataset.pay;S.pay[f]=i.value.trim()===""?null:i.value.trim();
    if(f==="rate")S.pay.mode="horaire";else if(f==="monthly")S.pay.mode="mensuel";
    updateEq(i);saveSettings();return;}
  if("cpstart" in i.dataset){S.conges.start=/^\d{4}-\d{2}-\d{2}$/.test(i.value)?i.value:null;saveSettings();return;}
  if("cp" in i.dataset){S.conges.report=i.value.trim()===""?null:i.value.trim();saveSettings();return;}
  if(i.id==="wiz-time"&&i.value){svcObj(i.dataset.wizs)[i.dataset.wizf]=i.value;tidy(key(S.cur));return;}
  if(i.id==="combo-url"){S.combo.url=i.value.trim()||null;savePlan();return;}
  if(i.dataset.prof){PROFILE[i.dataset.prof]=i.value;if(!OB)pushProfileSoon();else saveProfileLocal();return;}
});
/* revient au premier plan : rafraîchit la date du jour et vérifie le rappel */
document.addEventListener("visibilitychange",function(){if(!document.hidden){checkReminder();autoSync();}});
setInterval(checkReminder,60000);

document.getElementById("toplogo").innerHTML=BOT;
askPermissionOnce();
setupSW();
boot();
})();
