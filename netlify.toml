[build]
  publish = "."
  functions = "netlify/functions"

# même adresse que sur Cloudflare Pages
[[redirects]]
  from = "/api/combo"
  to = "/.netlify/functions/combo"
  status = 200

# portfolio : adresse officielle sur iolite.team
[[redirects]]
  from = "/portfolio/*"
  to = "https://iolite.team/portfolio/:splat"
  status = 301
  force = true
[[redirects]]
  from = "/portfolio"
  to = "https://iolite.team/portfolio/"
  status = 301
  force = true
